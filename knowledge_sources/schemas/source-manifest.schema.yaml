$schema: https://json-schema.org/draft/2020-12/schema
$id: https://chatmaker.dev/schemas/knowledge-source-manifest.schema.yaml
title: ChatMaker governed Knowledge source manifest
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - title
  - board_id
  - source_type
  - license_use_boundary
  - cleaning_version
  - review_date
  - cleaning_verified
  - source_reviewed
  - publication_approved
  - page_declarations
properties:
  schema_version: {const: "1.0"}
  id:
    type: string
    pattern: "^source-[a-z0-9][a-z0-9-]*$"
  title:
    type: string
    minLength: 1
  board_id:
    enum: [arduino-nano-classic, arduino-uno-r3, esp32-devkit-v1, idmc-0001-starcore-v4-2-2]
  source_type:
    enum: [canonical-board-documentation, checked-in-project-documentation, owned-local-source]
  canonical_url:
    type: string
    format: uri
  owned_local_source:
    type: object
    additionalProperties: false
    required: [description, sha256]
    properties:
      description: {type: string, minLength: 1}
      sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  license_use_boundary:
    type: string
    minLength: 1
  cleaning_version:
    type: string
    minLength: 1
  review_date:
    type: [string, "null"]
    format: date
  cleaning_verified: {$ref: "#/$defs/gate"}
  source_reviewed: {$ref: "#/$defs/gate"}
  publication_approved: {$ref: "#/$defs/gate"}
  page_declarations:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [stable_id, path]
      properties:
        stable_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*$"
        path: {type: string, minLength: 1}
  source_evidence:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [source_id, description, sha256]
      properties:
        source_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
        description: {type: string, minLength: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  module_migrations:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [hardware_id, approved_rewritten_uses, source_ids]
      properties:
        hardware_id: {type: string, pattern: "^IDM[DMS]-[0-9]{4}$"}
        approved_rewritten_uses:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [normalized-facts, beginner-wiring-guidance, library-api-guidance, derivative-examples, sanitized-mechanical-facts]
        source_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
  publication_boundary:
    type: object
    additionalProperties: false
    required: [public, private]
    properties:
      public:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      private:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
oneOf:
  - required: [canonical_url]
    not: {required: [owned_local_source]}
  - required: [owned_local_source]
    not: {required: [canonical_url]}
allOf:
  - if:
      properties:
        board_id: {const: idmc-0001-starcore-v4-2-2}
      required: [board_id]
    then:
      required: [source_evidence, module_migrations, publication_boundary]
$defs:
  gate:
    type: object
    additionalProperties: false
    required: [status, date, evidence]
    properties:
      status: {enum: [unverified, verified, failed, not_applicable]}
      date:
        type: [string, "null"]
        format: date
      evidence:
        type: [string, "null"]
