$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, source_package, module_count, modules]
properties:
  schema_version: {const: "1.0"}
  id: {const: self-developed-hardware-handoff-2026-07-25}
  source_package:
    type: object
    required: [archive_date, module_index, full_file_index, raw_material_root]
  module_count: {const: 23}
  modules:
    type: array
    minItems: 23
    maxItems: 23
    items:
      type: object
      required:
        - hardware_id
        - catalog_id
        - display_name
        - source_name
        - purpose
        - io_role
        - category
        - interface
        - power
        - confirmed_wiring
        - unknowns
        - example_capabilities
        - mechanical
        - evidence_status
        - usability
        - capability_gates
        - historical_use
        - source_evidence
      properties:
        hardware_id: {type: string, pattern: "^IDM[CDFMS]-[0-9]{4}$"}
        catalog_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]+$"}
        display_name: {type: string, minLength: 1}
        source_name: {type: string, minLength: 1}
        purpose: {type: string, minLength: 1}
        io_role: {enum: [controller, input, output, input_output, actuator, power, connectivity]}
        category: {type: string, minLength: 1}
        interface: {type: object, required: [type]}
        power: {type: object, required: [status]}
        confirmed_wiring: {type: array, items: {type: object}}
        unknowns: {type: array, items: {type: string}}
        example_capabilities: {type: array, minItems: 1, items: {type: string}}
        mechanical:
          type: object
          required: [outline, mounting_status, source_files]
        evidence_status: {enum: [verified, verified_with_safe_default, partial, documentation_conflict]}
        usability: {const: guidance_ready}
        capability_gates:
          type: object
          required: [programming, wiring, mechanical_placement, panel_cutout]
          properties:
            programming: {enum: [ready, conditional, not_applicable]}
            wiring: {enum: [ready, assignment_required, version_check]}
            mechanical_placement: {enum: [ready, requires_measurement]}
            panel_cutout: {enum: [ready, requires_measurement, not_available]}
          additionalProperties: false
        historical_use:
          type: object
          required: [status, confirmed_at, evidence, current_physical_retest]
          properties:
            status: {const: owner_confirmed}
            confirmed_at: {const: "2026-08-27"}
            evidence: {type: string, minLength: 1}
            current_physical_retest: {const: unverified}
          additionalProperties: false
        source_evidence:
          type: array
          minItems: 2
          items:
            type: object
            required: [path, sha256, evidence_type]
            properties:
              path: {type: string, minLength: 1}
              sha256: {type: string, pattern: "^[A-F0-9]{64}$"}
              evidence_type: {enum: [index, mechanical-step, mechanical-dxf, documentation, schematic, datasheet, extension, image, archive]}
