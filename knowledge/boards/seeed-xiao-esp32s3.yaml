- section_id: start-here
  title: 从这里开始
  summary: 先让小板的用户灯一闪一闪，再把串口输出显示到电脑上。确认你用的是普通 XIAO ESP32S3，选择 `seeed-xiao-esp32s3`。
  consumers:
