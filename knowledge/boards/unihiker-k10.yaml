- section_id: start-here
  title: 从这里开始
  summary: 先让 K10 的三颗板载彩灯轮流亮，再尝试接入屏幕和传感器。看包装或背面是否写 K10 / DFR0992，选择 `unihiker-k10`。
  consumers:
