[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatmaker"
version = "0.1.0rc5"
description = "AI-native beginner maker workflows for hardware and native web projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "PyYAML>=6.0,<7",
  "cryptography>=45,<49",
  "fonttools>=4.47,<5",
  "jsonschema>=4.20,<5",
  "pyserial>=3.5,<4",
]

[project.scripts]
chatmaker-doctor = "chatmaker.doctor:main"
chatmaker-catalog = "chatmaker.catalog:main"
chatmaker-route = "chatmaker.route:main"
chatmaker-nano = "chatmaker.hardware.nano_mindplus:main"
chatmaker-uno = "chatmaker.hardware.uno_mindplus:main"
chatmaker-esp32 = "chatmaker.hardware.esp32_devkit_v1:main"
chatmaker-nano-examples = "chatmaker.hardware.nano_examples:main"
chatmaker-avr-project = "chatmaker.hardware.project_flow:main"
chatmaker-starcore = "chatmaker.hardware.starcore:main"
chatmaker-serial = "chatmaker.hardware.serial_monitor:main"
chatmaker-workbuddy-mcp = "chatmaker.integrations.workbuddy_mcp:main"
chatmaker-install = "chatmaker.installers.auto:main"
chatmaker-web = "chatmaker.web.generator:main"
chatmaker-web-plan = "chatmaker.web.planner:main"
chatmaker-web-playground = "chatmaker.web.playground:main"
chatmaker-web-preview = "chatmaker.web.preview:main"
chatmaker-web-embed = "chatmaker.web.embed:main"
chatmaker-pack = "chatmaker.pack_cli:main"
chatmaker-knowledge = "chatmaker.knowledge:main"
chatmaker-cad = "chatmaker.cad.generator:main"

[tool.setuptools]
package-dir = {"" = "runtime"}

[tool.setuptools.packages.find]
where = ["runtime"]
