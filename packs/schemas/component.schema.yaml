$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, kind, id, name, category, interface, supply_voltage, sources, verification, pins, supported_boards, constraints, identification, libraries, example_files, common_failures, board_notes]
properties:
  schema_version: {const: "1.0"}
  kind: {const: component}
  id: {type: string, pattern: "^[a-z0-9][a-z0-9-]+$"}
  hardware_id: {type: string, pattern: "^[A-Z0-9]+-[0-9]+$"}
  name: {type: string, minLength: 1}
  aliases: {type: array, items: {type: string, minLength: 1}}
  category: {type: string, minLength: 1}
  interface: {type: string, minLength: 1}
  supply_voltage: {type: object, required: [minimum, maximum]}
  logic_boundary: {type: string, minLength: 1}
  source_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  mindplus:
    type: object
    required: [extension, headers, api]
    properties:
      extension: {type: string, minLength: 1}
      headers: {type: array, items: {type: string, minLength: 1}}
      api: {type: string, minLength: 1}
  historical_lead:
    type: object
    required: [status, evidence]
    properties:
      status: {const: legacy_reported}
      evidence: {type: string, minLength: 1}
  sources: {$ref: "#/$defs/sources"}
  verification: {$ref: "#/$defs/verification"}
  pins: {type: array, minItems: 1, items: {type: object, required: [id, role]}}
  supported_boards: {type: array, items: {type: string}}
  constraints: {type: array, items: {type: string}}
  identification: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  libraries:
    type: array
    items:
      type: object
      required: [name, headers, status, notes]
      properties:
        name: {type: string, minLength: 1}
        headers: {type: array, items: {type: string, minLength: 1}}
        status: {enum: [builtin, compile_verified, unverified]}
        notes: {type: string, minLength: 1}
  example_files: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  common_failures: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  board_notes:
    type: object
    minProperties: 1
    additionalProperties: {type: string, minLength: 1}
$defs:
  sources:
    type: array
    minItems: 1
    items: {type: object, required: [title, url], properties: {title: {type: string}, url: {type: string, format: uri}}}
  gate:
    type: object
    required: [status, checked_at, evidence]
    properties:
      status: {enum: [unverified, verified, failed, not_applicable]}
      checked_at: {type: [string, "null"], format: date}
      evidence: {type: [string, "null"]}
  verification:
    type: object
    required: [source_reviewed, code_compiled, firmware_uploaded, physical_effect_verified]
    properties:
      source_reviewed: {$ref: "#/$defs/gate"}
      code_compiled: {$ref: "#/$defs/gate"}
      firmware_uploaded: {$ref: "#/$defs/gate"}
      physical_effect_verified: {$ref: "#/$defs/gate"}
    additionalProperties: {$ref: "#/$defs/gate"}
