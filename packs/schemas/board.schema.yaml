$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, kind, id, name, family, mcu, logic_voltage, chatmaker, mechanics, sources, verification, pins, constraints, toolchains]
properties:
  schema_version: {const: "1.0"}
  kind: {const: board}
  id: {type: string, pattern: "^[a-z0-9][a-z0-9-]+$"}
  name: {type: string, minLength: 1}
  family: {type: string, minLength: 1}
  mcu: {type: string, minLength: 1}
  logic_voltage: {type: number, exclusiveMinimum: 0}
  chatmaker:
    type: object
    additionalProperties: false
    required: [runtime_cli, runtime_module, identification]
    properties:
      runtime_cli: {type: [string, "null"], minLength: 1}
      runtime_module: {type: [string, "null"], pattern: "^chatmaker\\.[a-z0-9_.]+$"}
      identification: {enum: [automatic, assisted, manual]}
  mechanics:
    type: object
    additionalProperties: false
    required: [status, profile_path, fit_verified, notes]
    properties:
      status: {enum: [profile-available, research-required, not-applicable]}
      profile_path: {type: [string, "null"], pattern: "^knowledge/mechanical/boards/[a-z0-9-]+\\.json$"}
      fit_verified: {type: boolean}
      notes: {type: string, minLength: 1}
  sources: {$ref: "#/$defs/sources"}
  verification: {$ref: "#/$defs/verification"}
  feature_verification:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/scoped_verification"}
  pins:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, capabilities]
      properties:
        id: {type: string, minLength: 1}
        kind: {enum: [gpio, power-rail, ground, connector-signal]}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        source_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
  onboard_hardware:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, name, category, source_ids]
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9-]+$"}
        name: {type: string, minLength: 1}
        category: {type: string, minLength: 1}
        interface:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, minLength: 1}
            address: {type: string, pattern: "^0x[0-9A-F]{2}$"}
            sda_pin: {type: string, minLength: 1}
            scl_pin: {type: string, minLength: 1}
            interrupt_gpio: {type: integer, minimum: 0}
        library:
          type: object
          additionalProperties: false
          required: [header, initialization, object]
          properties:
            header: {type: string, minLength: 1}
            initialization: {type: string, minLength: 1}
            object: {type: string, minLength: 1}
            read_methods:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, minLength: 1}
            gesture_methods:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, minLength: 1}
            gesture_values:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, minLength: 1}
        source_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
  constraints: {type: array, items: {type: string}}
  constraint_pin_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  toolchains: {type: array, items: {type: object, required: [id, status]}}
  toolchain_selection:
    type: object
    additionalProperties: false
    required: [policy, when_both_available, when_none_available]
    properties:
      policy: {const: reuse-any-usable-installation}
      when_both_available: {type: string, minLength: 1}
      when_none_available: {type: string, minLength: 1}
$defs:
  sources:
    type: array
    minItems: 1
    items: {type: object, required: [title, url], properties: {title: {type: string}, url: {type: string, format: uri}}}
  gate:
    type: object
    required: [status, checked_at, evidence]
    properties:
      status: {enum: [unverified, verified, failed, not_applicable]}
      checked_at: {type: [string, "null"], format: date}
      evidence: {type: [string, "null"]}
      evidence_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]+$"}
      evidence_ref: {type: string, pattern: "^docs/verification/[A-Za-z0-9._/-]+\\.md$"}
      method: {enum: [source-review, command-result, serial-observation, serial-proxy, user-confirmation, sensor-observation, not-applicable]}
    additionalProperties: false
  scoped_verification:
    type: object
    required: [feature_id, name, verification]
    additionalProperties: false
    properties:
      feature_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]+$"}
      name: {type: string, minLength: 1}
      verification:
        type: object
        minProperties: 1
        additionalProperties: {$ref: "#/$defs/gate"}
  verification:
    type: object
    required: [source_reviewed, code_compiled, firmware_uploaded, physical_effect_verified]
    properties:
      source_reviewed: {$ref: "#/$defs/gate"}
      code_compiled: {$ref: "#/$defs/gate"}
      firmware_uploaded: {$ref: "#/$defs/gate"}
      physical_effect_verified: {$ref: "#/$defs/gate"}
    additionalProperties: {$ref: "#/$defs/gate"}
