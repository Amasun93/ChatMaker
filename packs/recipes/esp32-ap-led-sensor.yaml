schema_version: "1.0"
kind: recipe
id: esp32-ap-led-sensor
name: DOIT ESP32 DevKit V1 AP LED and potentiometer control
summary: Create a local ESP32 access point that controls an external GPIO23 LED through a current-limiting resistor and reads a 3V3-powered 10 kOhm potentiometer on GPIO34.
sources:
  - title: Arduino-ESP32 3.3.11 WiFiAccessPoint example
    url: https://github.com/espressif/arduino-esp32/blob/3.3.11/libraries/WiFi/examples/WiFiAccessPoint/WiFiAccessPoint.ino
  - title: Arduino-ESP32 3.3.11 WebServer HelloServer example
    url: https://github.com/espressif/arduino-esp32/blob/3.3.11/libraries/WebServer/examples/HelloServer/HelloServer.ino
  - title: Espressif ESP32 GPIO restrictions
    url: https://github.com/espressif/esp-idf/blob/v5.5.5/docs/en/api-reference/peripherals/gpio/esp32.inc
verification:
  source_reviewed: &unverified
    status: unverified
    checked_at: null
    evidence: null
  code_compiled: *unverified
  firmware_uploaded: *unverified
  wifi_ap_available: *unverified
  http_exchange_verified: *unverified
  physical_effect_verified: *unverified
boards:
  - esp32-devkit-v1
components:
  - basic-led
  - linear-potentiometer-10k
wiring:
  - component: basic-led
    component_pin: anode
    board_pin: GPIO23
  - component: basic-led
    component_pin: cathode
    board_pin: GND
    shared: true
  - component: linear-potentiometer-10k
    component_pin: VCC
    board_pin: 3V3
  - component: linear-potentiometer-10k
    component_pin: GND
    board_pin: GND
    shared: true
  - component: linear-potentiometer-10k
    component_pin: OUT
    board_pin: GPIO34
source_file: examples/chatduino/esp32/ap-led-sensor/ap-led-sensor.ino
expected_effect: After every runtime gate is separately verified, a phone joins ChatMaker-ESP32, opens 192.168.4.1, controls the GPIO23 LED, and reads the GPIO34 potentiometer value through the local HTTP page.
