schema_version: "1.0"
kind: recipe
id: nano-ultrasonic-buzzer
name: Nano ultrasonic proximity buzzer
summary: Read distance from an HC-SR04 and switch on a confirmed active buzzer within 20 centimetres.
sources:
  - title: SparkFun HC-SR04 datasheet mirror
    url: https://cdn.sparkfun.com/datasheets/Sensors/Proximity/HCSR04.pdf
verification:
  source_reviewed: &unverified
    status: unverified
    checked_at: null
    evidence: null
  code_compiled:
    status: verified
    checked_at: "2026-08-14"
    evidence: Compiled with Mind+ 2.x using only the AVR core; see docs/verification/2026-08-14-nano-mindplus-compilation.md.
  firmware_uploaded: *unverified
  physical_effect_verified: *unverified
boards:
  - arduino-nano-classic
components:
  - hc-sr04
  - active-buzzer-module
wiring:
  - component: hc-sr04
    component_pin: VCC
    board_pin: 5V
    shared: true
  - component: hc-sr04
    component_pin: TRIG
    board_pin: D7
  - component: hc-sr04
    component_pin: ECHO
    board_pin: D8
  - component: hc-sr04
    component_pin: GND
    board_pin: GND
    shared: true
  - component: active-buzzer-module
    component_pin: VCC
    board_pin: 5V
    shared: true
  - component: active-buzzer-module
    component_pin: GND
    board_pin: GND
    shared: true
  - component: active-buzzer-module
    component_pin: SIG
    board_pin: D6
source_file: examples/chatduino/nano/ultrasonic-buzzer/ultrasonic-buzzer.ino
expected_effect: The buzzer turns on when a valid measured distance is below 20 centimetres and stays off on timeout.
