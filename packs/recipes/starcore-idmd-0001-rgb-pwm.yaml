  code_compiled: &unverified
    status: unverified
    checked_at: null
    evidence: null
  firmware_uploaded: *unverified
  physical_effect_verified: *unverified
boards: [idmc-0001-starcore-v4-2-2]
components: [idmd-0001-starcore-rgb-light]
wiring:
  - {component: idmd-0001-starcore-rgb-light, component_pin: VCC, board_pin: 3V3}
  - {component: idmd-0001-starcore-rgb-light, component_pin: RED, board_pin: P13}
  - {component: idmd-0001-starcore-rgb-light, component_pin: GREEN, board_pin: P14}
