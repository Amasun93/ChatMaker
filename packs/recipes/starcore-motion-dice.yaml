schema_version: "1.0"
kind: recipe
id: starcore-motion-dice
name: 星核板摇一摇掷骰子
summary: 读取星核板板载 QMI8658 加速度，摇动或按 A/B 后在外接 OLED 显示 1–6 点并让板载无源蜂鸣器短响。
sources:
  - title: Starcore libraries and examples
    url: https://github.com/Amasun93/ChatMaker/tree/main/knowledge_sources/published/boards/idmc-0001-starcore-v4-2-2
boards: [idmc-0001-starcore-v4-2-2]
components: [idmd-0021-starcore-oled-1-3]
wiring:
  - {component: idmd-0021-starcore-oled-1-3, component_pin: VCC, board_pin: 3V3}
  - {component: idmd-0021-starcore-oled-1-3, component_pin: GND, board_pin: GND}
  - {component: idmd-0021-starcore-oled-1-3, component_pin: SCL, board_pin: P19}
  - {component: idmd-0021-starcore-oled-1-3, component_pin: SDA, board_pin: P20}
source_file: examples/chatduino/starcore/motion-dice/motion-dice.ino
web_demo: examples/chatweb/starcore-motion-dice.html
expected_effect: 摇动星核板或按 A/B 后，OLED 显示新的 DICE 点数，蜂鸣器短响，115200 串口输出 DICE_ROLL；网页文件只模拟这些状态。
