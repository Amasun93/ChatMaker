schema_version: "1.0"
kind: recipe
id: nano-oled-light
name: Nano OLED light display
summary: Show an analog light reading on a confirmed SSD1306 128x64 I2C display.
sources:
  - title: SSD1306 controller datasheet
    url: https://cdn-shop.adafruit.com/datasheets/SSD1306.pdf
verification:
  source_reviewed: &unverified
    status: unverified
    checked_at: null
    evidence: null
  code_compiled:
    status: verified
    checked_at: "2026-08-14"
    evidence: Compiled with Mind+ 2.x using DFRobot_SSD1306_I2C.h; see docs/verification/2026-08-14-nano-mindplus-compilation.md.
  firmware_uploaded: *unverified
  physical_effect_verified: *unverified
boards:
  - arduino-nano-classic
components:
  - analog-light-sensor-module
  - ssd1306-i2c-128x64-module
wiring:
  - component: analog-light-sensor-module
    component_pin: VCC
    board_pin: 5V
    shared: true
  - component: analog-light-sensor-module
    component_pin: GND
    board_pin: GND
    shared: true
  - component: analog-light-sensor-module
    component_pin: AO
    board_pin: A0
  - component: ssd1306-i2c-128x64-module
    component_pin: VCC
    board_pin: 5V
    shared: true
  - component: ssd1306-i2c-128x64-module
    component_pin: GND
    board_pin: GND
    shared: true
  - component: ssd1306-i2c-128x64-module
    component_pin: SCL
    board_pin: A5
  - component: ssd1306-i2c-128x64-module
    component_pin: SDA
    board_pin: A4
source_file: examples/chatduino/nano/oled-light/oled-light.ino
expected_effect: The OLED and serial output update with the analog light reading about five times per second.
