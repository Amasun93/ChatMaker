schema_version: "1.0"
kind: recipe
id: stardust-idmd-0021-oled-status
name: 星尘板自研 OLED 状态页
summary: 在已确认的 IDMD-0021 1.3 寸屏上静态显示状态，并用串口报告程序持续运行。
sources:
  - title: ChatMaker 星尘板与自研 OLED 实板记录
    url: https://github.com/Amasun93/ChatMaker/blob/main/docs/verification/2026-08-26-stardust-oled-physical-board.md
verification:
  source_reviewed:
    status: verified
    checked_at: "2026-08-26"
    evidence: The self-developed OLED schematic confirms SSD1306, 128x64, 3.3V/5V supply and selectable 0x3C/0x3D addresses; the connected unit responded at 0x3C.
    evidence_id: stardust-oled-source-scan-2026-08-26
    evidence_ref: docs/verification/2026-08-26-stardust-oled-physical-board.md
    method: source-review
  code_compiled:
    status: verified
    checked_at: "2026-08-26"
    evidence: The exact checked-in source compiled successfully for the observed Nano-compatible ATmega328P target.
    evidence_id: stardust-oled-compile-2026-08-26
    evidence_ref: docs/verification/2026-08-26-stardust-oled-physical-board.md
    method: command-result
  firmware_uploaded:
    status: verified
    checked_at: "2026-08-26"
    evidence: COM8 upload wrote and verified 7814 bytes using the observed 115200 bootloader profile.
    evidence_id: stardust-oled-upload-2026-08-26
    evidence_ref: docs/verification/2026-08-26-stardust-oled-physical-board.md
    method: command-result
  serial_evidence:
    status: verified
    checked_at: "2026-08-26"
    evidence: STARDUST_OLED_READY and repeating STARDUST_ALIVE were observed at 115200 baud after reset.
    evidence_id: stardust-oled-serial-2026-08-26
    evidence_ref: docs/verification/2026-08-26-stardust-oled-physical-board.md
    method: serial-observation
  physical_effect_verified:
    status: unverified
    checked_at: null
    evidence: The program reached the display calls, but visible text, orientation and clarity require user observation.
effect_verification:
  - effect_id: oled-write-path
    name: OLED 写入路径运行
    verification:
      display_proxy_evidence:
        status: verified
        checked_at: "2026-08-26"
        evidence: STARDUST_OLED_READY was emitted only after the four static display lines were written.
        evidence_id: stardust-oled-proxy-2026-08-26
        evidence_ref: docs/verification/2026-08-26-stardust-oled-physical-board.md
        method: serial-proxy
  - effect_id: oled-visible-status
    name: OLED 肉眼显示状态页
    verification:
      physical_effect_verified:
        status: unverified
        checked_at: null
        evidence: Waiting for the user to inspect the connected screen.
boards: [stardust-atmega328p]
components: [idmd-0021-starcore-oled-1-3]
wiring:
  - {component: idmd-0021-starcore-oled-1-3, component_pin: VCC, board_pin: 5V}
  - {component: idmd-0021-starcore-oled-1-3, component_pin: GND, board_pin: GND}
  - {component: idmd-0021-starcore-oled-1-3, component_pin: SCL, board_pin: A5}
  - {component: idmd-0021-starcore-oled-1-3, component_pin: SDA, board_pin: A4}
source_file: examples/chatduino/stardust/oled-status/oled-status.ino
expected_effect: 串口先显示 STARDUST_OLED_READY，之后持续显示 STARDUST_ALIVE；屏幕静态显示四行状态文字，肉眼效果待用户确认。
