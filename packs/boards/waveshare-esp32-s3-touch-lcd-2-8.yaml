pins:
  - {id: GPIO15, capabilities: [digital-input, digital-output, pwm]}
  - {id: GPIO18, capabilities: [digital-input, digital-output, pwm]}
  - {id: GPIO10, capabilities: [i2c-scl, onboard-shared]}
  - {id: GPIO11, capabilities: [i2c-sda, onboard-shared]}
  - {id: GPIO43, capabilities: [uart-tx, digital-output]}
  - {id: GPIO44, capabilities: [uart-rx, digital-input]}
  - {id: GPIO19, capabilities: [usb-d-minus, reserved-for-usb]}
  - {id: GPIO20, capabilities: [usb-d-plus, reserved-for-usb]}
