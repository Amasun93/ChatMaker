constraints:
  - Confirm V1 or V2 explicitly; recent purchase and ESP32-S3 chip identity do not establish revision.
  - GPIO signals are 3.3 V; do not feed 5 V into GPIO.
  - External GPIO10/11 share onboard I2C and cannot be reassigned as ordinary GPIO.
  - Touch has a separate I2C bus on SDA1/SCL3, reset2 and interrupt4; do not confuse this with external I2C.
  - ST7789 SPI uses MOSI45, clock40, CS42, DC41, reset39 and backlight5.
  - Reserve GPIO19/20 for native USB program upload and serial; select the data-capable USB connection.
  - This adapter does not establish support for the separately named 2.8B or 2.8C boards.
