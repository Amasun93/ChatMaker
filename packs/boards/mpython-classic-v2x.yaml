schema_version: "1.0"
kind: board
id: mpython-classic-v2x
name: 经典掌控板 V2.x
aliases: [掌控板, mPython 掌控板, 掌控板 V2, DFRobot DFR0608]
summary: ESP32 经典掌控板，带 128×64 OLED、按键、触摸、声光输入、RGB、蜂鸣器和随修订版本变化的运动传感器。
family: mpython-classic
mcu: ESP32
logic_voltage: 3.3
identity:
  product_line: mPython 掌控板
  sku: DFR0608
  revisions: [V2.0, V2.1, V2.2, V2.3]
  physical_board_is_not: IDMC-0001 星核板
display:
  type: monochrome-oled
  size_inches: 1.3
  resolution: 128x64
  api_object: oled
hardware_revisions:
  - revision: V2.0
    accelerometer: MSA300
    magnetometer: MMC5983MA
    usb_uart: CP2104
  - revision: V2.1
    accelerometer: QMI8658C
    magnetometer: MMC5983MA
    usb_uart: CH9102
  - revision: V2.2
    accelerometer: QMI8658C
    magnetometer: MMC5603NJ
    usb_uart: CH9102
  - revision: V2.3
    accelerometer: QMI8658C
    magnetometer: MMC5603NJ
    usb_uart: CH9102
    note: Official API pages describe behavior changes; an independently readable PCB revision field is not confirmed.
automatic_identification:
  safe_clues: [usb-uart-family, esp-chip-family, firmware-marker, verified-i2c-device-identity]
  exact_revision_may_require_silkscreen: true
  temporary_probe_requires_backup_and_restore: true
