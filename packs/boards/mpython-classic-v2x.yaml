  - {id: P26, kind: gpio, capabilities: [gpio-13, touch], source_ids: [mpython-classic-official-hardware]}
  - {id: P27, kind: gpio, capabilities: [gpio-15, touch, boot-related], source_ids: [mpython-classic-official-hardware]}
  - {id: P28, kind: gpio, capabilities: [gpio-4, touch, boot-related], source_ids: [mpython-classic-official-hardware]}
onboard_hardware:
  - {id: oled-128x64, name: 1.3-inch 128x64 monochrome OLED, category: display, interface: {type: i2c, address: "0x3C", sda_pin: P20, scl_pin: P19}, source_ids: [mpython-classic-official-hardware]}
  - {id: ws2812-three-pixel, name: Three onboard WS2812 RGB pixels, category: light-output, interface: {type: gpio, interrupt_gpio: 17}, source_ids: [mpython-classic-official-hardware]}
  - {id: passive-buzzer, name: Onboard passive buzzer, category: audio-output, interface: {type: pwm-gpio, interrupt_gpio: 16}, source_ids: [mpython-classic-official-hardware]}
  - {id: analog-light, name: ALS-PT19 analog light sensor, category: light-input, interface: {type: analog-gpio, interrupt_gpio: 39}, source_ids: [mpython-classic-official-hardware]}
  - {id: analog-microphone, name: EM4013 analog microphone, category: audio-input, interface: {type: analog-gpio, interrupt_gpio: 36}, source_ids: [mpython-classic-official-hardware]}
  - {id: revision-motion-sensor, name: MSA300 or QMI8658C according to hardware revision, category: motion-sensor, interface: {type: i2c, sda_pin: P20, scl_pin: P19}, source_ids: [mpython-classic-official-hardware]}
  - {id: revision-magnetometer, name: MMC5983MA or MMC5603NJ according to hardware revision, category: magnetic-sensor, interface: {type: i2c, sda_pin: P20, scl_pin: P19}, source_ids: [mpython-classic-official-hardware]}
sensor_semantics:
  light_read_unit: raw-12-bit-0-to-4095
  sound_read_unit: raw-12-bit-0-to-4095
constraints:
  - All GPIO logic is 3.3V; do not apply 5V logic to an input.
  - P2, P3, P4 and P10 are input-only.
  - P19/P20 share the onboard I2C bus; scan for address conflicts before adding devices.
  - Identify the printed hardware revision before relying on one fixed motion or magnetic sensor model.
  - A mPython-compatible compile target does not prove the physical board is a classic mPython board or Starcore.
constraint_pin_refs: [P2, P3, P4, P5, P10, P11, P19, P20, P25, P27, P28]
toolchains:
  - id: chatmaker-managed-mpython-classic
    status: windows_x64_compile_verified
    fqbn: mindplus:esp32:mpython:FlashMode=dio,FlashFreq=80,UploadSpeed=1500000,DebugLevel=none
    version_lock: arduino-cli-0.33.1-mindplus-esp32-0.0.1-libraries-1.0.0
    desktop_application_required: false
  - id: mindplus-1.8-mpython
    status: locally_discovered
    fqbn: dfrobot:mpython:mpython:FlashMode=dio,FlashFreq=80,UploadSpeed=1500000,DebugLevel=none
  - id: mindplus-2.0-mpython
    status: locally_discovered
    fqbn: mindplus:esp32:mpython:FlashMode=dio,FlashFreq=80,UploadSpeed=1500000,DebugLevel=none
