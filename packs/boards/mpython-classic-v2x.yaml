  - title: mPython 掌控板 API
    url: https://mpython.readthedocs.io/zh-cn/master/library/mPython/mpython.html
  - title: mPython official source
    url: https://github.com/labplus-cn/mpython
verification:
  source_reviewed:
    status: verified
    checked_at: "2026-08-23"
    evidence: Official hardware, version, API, OSHWA and local Mind+ 1.8/2.0 package facts were reviewed; revision contradictions remain explicit.
  code_compiled:
    status: verified
    checked_at: "2026-08-26"
    evidence: The exact Chinese status example compiled with exit code 0 using the isolated Windows x64 toolchain; upload and physical-board gates remain unverified.
    evidence_id: mpython-classic-chinese-status-compile-2026-08-26
    evidence_ref: docs/verification/2026-08-26-mpython-classic-independent-cli.md
    method: command-result
  firmware_uploaded: {status: unverified, checked_at: null, evidence: null}
  physical_effect_verified: {status: unverified, checked_at: null, evidence: null}
