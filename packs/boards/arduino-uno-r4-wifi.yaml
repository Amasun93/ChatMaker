constraints:
- Confirm the WiFi model and use its Renesas profile. The ESP32-S3 bridge is not the target of the classroom upload.
- R4 WiFi header logic is 5 V. Use the 3.3 V Qwiic bus with Wire1 for compatible modules.
- A4 and A5 share the main SDA and SCL signals with the dedicated SDA/SCL header.
- Do not drive motors or high-current loads from GPIO.
