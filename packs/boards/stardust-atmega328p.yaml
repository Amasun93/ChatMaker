constraints:
  - Only ATmega328P, CH340, the 115200 bootloader and the A4/A5 I2C route are physically verified; do not invent the remaining board labels or onboard features.
  - Keep D0/D1 free during upload even when the exact external header names are not yet documented.
  - The connected IDMD-0021 OLED was discovered at 0x3C; an address response does not prove visible output.
  - The current representative target is Nano-compatible for compilation and upload, but the product remains a distinct self-developed board record.
constraint_pin_refs: [USB, 5V, GND, A4, A5]
