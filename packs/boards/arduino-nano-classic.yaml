    evidence: The OLED dashboard compiled with Mind+ 2.x and FQBN mindplus:avr:nano:cpu=atmega328, extending the previously verified Nano examples; see docs/verification/2026-08-17-avr-oled-dashboard-compilation.md.
  firmware_uploaded: *unverified
  physical_effect_verified: *unverified
pins:
  - id: D13
    capabilities: [digital, output, builtin-led]
  - id: D2
    capabilities: [digital, interrupt, input, output]
  - id: D4
    capabilities: [digital, input, output]
  - id: D6
    capabilities: [digital, pwm, input, output]
  - id: D7
    capabilities: [digital, input, output]
  - id: D8
    capabilities: [digital, input, output]
  - id: D9
    capabilities: [digital, pwm, input, output]
  - id: D10
    capabilities: [digital, pwm, input, output]
  - id: D11
    capabilities: [digital, pwm, input, output]
  - id: A0
    capabilities: [analog-input, digital]
  - id: A4
    capabilities: [analog-input, digital, i2c-sda]
  - id: A5
    capabilities: [analog-input, digital, i2c-scl]
  - id: D0
    capabilities: [digital, serial-rx]
  - id: D1
    capabilities: [digital, serial-tx]
