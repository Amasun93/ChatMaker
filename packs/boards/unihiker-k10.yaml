constraints:
- Confirm K10 or DFR0992. The M10 Debian project workflow does not apply.
- Use 3.3 V signal levels. The P19/P20 I2C bus is shared with onboard peripherals; check module address collisions.
- Reserve GPIO46 for the board RGB chain and GPIO19/20 for USB. Check the exact K10 diagram before using edge contacts.
- Loading an Arduino sketch replaces the application in flash. Keep the original project or vendor recovery image if needed.
