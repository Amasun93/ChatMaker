    name: 板载无源蜂鸣器
    verification:
      serial_proxy_evidence:
        status: verified
        checked_at: "2026-08-25"
        evidence: The known self-test emitted BUZZER_COMMAND_COMPLETE on the identified healthy board; this proxy is limited to that board and program.
        evidence_id: starcore-buzzer-command-proxy-2026-08-25
        evidence_ref: docs/verification/2026-08-25-p0-no-mcp-starcore.md
        method: serial-proxy
      physical_effect_verified:
        status: verified
        checked_at: "2026-08-25"
        evidence: The user previously confirmed that the known self-test produced audible buzzer output; the latest WorkBuddy run did not repeat this listening check.
        evidence_id: starcore-buzzer-user-confirmation-2026-08-25
        evidence_ref: docs/verification/2026-08-25-p0-no-mcp-starcore.md
