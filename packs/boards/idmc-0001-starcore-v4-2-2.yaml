interfaces:
  - id: usb-c
    purpose: 5V power, programming, serial diagnostics, and automatic boot/download control
    controller: CH9102F
  - id: can-bus
    physical_layer: SIT3051TK
    controller_tx: P13/GPIO18
    controller_rx: P14/GPIO19
    connector_signals: [VIN, GND, CAN_L, CAN_H]
  - id: i2c-3v3-bank
    count: 3
    signals: [3V3, GND, P19/SCL, P20/SDA]
  - id: i2c-5v-bank
    count: 3
    signals: [5V, GND, level-shifted-SCL, level-shifted-SDA]
    level_shifter: 2N7002-based bidirectional level shifting
  - id: svg-gpio-bank
    layout: three-row signal-voltage-ground connector bank
power_inputs:
  - id: usb-c-5v
    range: regulated 5V only
    path: protected USB power path
  - id: vin-6-24v
    range: 6-24V DC
    regulator: MP28373 buck to approximately 5.09V
  - id: d5v-3.8-5.5v
    range: 3.8-5.5V DC
    regulator: RT9059 to 3.3V
  - id: direct-3v3
    range: regulated 3.3V only
    regulator: none
software_compatibility:
  physically_present_mpython_objects: [buttonA, buttonB, buttonAB, buzz, accelerometer]
  exposed_but_not_onboard_hardware: [display, rgb, light, sound]
  pin_objects_without_dedicated_touch_pads: [touchPadP, touchPadY, touchPadT, touchPadH, touchPadO, touchPadN]
  initialization_side_effects:
    - mPython.begin() initializes a display object at I2C address 0x3C even though no display is onboard.
    - mPython.begin() initializes the mPython three-pixel WS2812 model on P7/GPIO17 even though no WS2812 is onboard.
    - light.read() reads P4/GPIO39 and sound.read() reads P10/GPIO36; without external sensors these are not real light or sound measurements.
constraints:
  - ESP32 input signals must remain at or below 3.3V; a 5V-powered module does not guarantee a safe signal level.
  - P2, P3, P4, P10, IO37 and IO38 are input-only; do not use them to drive LEDs, trigger outputs or actuators.
  - P5, P11, P16, P25, P27 and P28 require startup-state caution; A/B button presses also change boot-related pins.
  - P13 and P14 are shared with the onboard CAN transceiver. Do not assign them to another peripheral while CAN is active.
  - P23/P26 are the reviewed classroom UART pair for IDMM-0007 diagnosis; protocol uncertainty does not authorize transmitting motion commands.
  - The onboard QMI8658 already occupies the shared P20/P19 I2C bus at address 0x6B; do not add external wiring or reuse that address.
  - QMI8658 contains a gyroscope, but the reviewed MPython public object exposes acceleration and gestures only; gyroscope values require a separately reviewed driver path.
  - The mPython software target does not prove that display, RGB pixels, a light sensor or a microphone are physically onboard Starcore.
  - Use one verified power input path at a time. Do not parallel USB, VIN, 5V-input and direct-3.3V sources unless an electrical design has been reviewed.
  - The onboard CAN transceiver is only the physical layer. Bit rate, node IDs, termination, cable and protocol must still match the actual CAN network.
  - In Mind+ choose the mPython-compatible target, but use Starcore physical wiring rather than copying another board image.
  - Use the exact v4.2.2 mechanical profile for CAD work; physical fit, supplied screws and connector clearance remain unverified.
constraint_pin_refs: [IO37, IO38, P2, P3, P4, P5, P10, P11, P13, P14, P16, P19, P20, P25, P27, P28]
toolchains:
  - id: chatmaker-managed-starcore
    status: verified_supported
    role: preferred
  - id: mindplus-1.8-mpython
    status: verified_supported
    role: compatibility-fallback
  - id: mindplus-2.0-mpython
    status: verified_supported
    role: compatibility-fallback
toolchain_selection:
  policy: reuse-any-usable-installation
  when_both_available: mindplus-2.0-mpython
  when_none_available: prepare-chatmaker-managed-starcore
