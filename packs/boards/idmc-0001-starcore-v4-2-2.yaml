    name: 板载 QMI8658 加速度传感器
    verification:
      serial_evidence:
        status: verified
        checked_at: "2026-08-25"
        evidence: The latest self-test run emitted continuing three-axis and total-acceleration data at 115200 baud.
        evidence_id: starcore-qmi8658-serial-2026-08-25
        evidence_ref: docs/verification/2026-08-25-p0-no-mcp-starcore.md
        method: sensor-observation
      physical_effect_verified:
        status: verified
        checked_at: "2026-08-24"
        evidence: Eight static QMI8658 samples from the identified board measured approximately 1 g total acceleration; this does not validate orientation or gesture thresholds.
        evidence_id: starcore-qmi8658-static-samples-2026-08-24
        evidence_ref: docs/verification/2026-08-24-starcore-physical-board.md
        method: sensor-observation
