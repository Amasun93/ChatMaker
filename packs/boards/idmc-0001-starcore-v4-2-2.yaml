onboard_hardware:
  - id: qmi8658
    name: QMI8658 six-axis inertial sensor
    category: motion-sensor
    interface:
      type: i2c
      address: "0x6B"
      sda_pin: P20
      scl_pin: P19
      interrupt_gpio: 37
    library:
      header: MPython.h
      initialization: mPython.begin()
      object: accelerometer
      read_methods: [getX(), getY(), getZ(), getStrength()]
      gesture_methods: [isGesture(), onGesture()]
      gesture_values: [Shake, TiltLeft, TiltRight, TiltForward, TiltBack]
    source_ids:
      - starcore-board-schematic-v4-2-2
      - starcore-qmi8658-datasheet
      - starcore-mpython-public-api-snapshot
      - starcore-mpython-implementation-snapshot
constraints:
  - ESP32 input signals must remain at or below 3.3V; a 5V-powered module does not guarantee a safe signal level.
  - P2 and P3 are input-only; P5, P11, P16, P25, P27 and P28 require startup-state caution.
  - P23/P26 are the reviewed classroom UART pair for IDMM-0007 diagnosis; protocol uncertainty does not authorize transmitting motion commands.
  - In Mind+ choose the mPython-compatible target, but use Starcore physical wiring rather than copying another board image.
  - The onboard QMI8658 already occupies the shared P20/P19 I2C bus at address 0x6B; do not add external wiring or reuse that address.
  - Use the exact v4.2.2 mechanical profile for CAD work.
  - Physical fit, supplied screws and connector clearance remain unverified.
constraint_pin_refs: [P2, P3, P5, P11, P16, P25, P27, P28]
toolchains:
