onboard_hardware:
  - id: qmi8658
    name: QMI8658 six-axis inertial sensor
    category: motion-sensor
    interface:
      type: i2c
      address: "0x6B"
      sda_pin: P20
      scl_pin: P19
      interrupt_gpio: 37
    library:
      header: MPython.h
      initialization: mPython.begin()
      object: accelerometer
      read_methods: [getX(), getY(), getZ(), getStrength()]
      gesture_methods: [isGesture(), onGesture()]
      gesture_values: [Shake, ScreenUp, ScreenDown, TiltLeft, TiltRight, TiltForward, TiltBack]
    source_ids: [starcore-board-schematic-v4-2-2, starcore-qmi8658-datasheet, starcore-mpython-public-api-snapshot, starcore-mpython-implementation-snapshot]
  - id: button-a
    name: Active-low onboard button A
    category: user-input
    interface:
      type: gpio-active-low
    library:
      header: MPython.h
      initialization: global object; no explicit begin required
      object: buttonA
      read_methods: [isPressed(), setPressedCallback(), setUnPressedCallback()]
    source_ids: [starcore-board-schematic-v4-2-2, starcore-board-description-doc, starcore-mpython-public-api-snapshot, starcore-mpython-implementation-snapshot]
  - id: button-b
