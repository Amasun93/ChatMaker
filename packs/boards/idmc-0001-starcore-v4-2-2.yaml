    status: verified
    checked_at: "2026-08-25"
    evidence: v4.2.2 hardware sources and both Mind+ targets were reviewed; board identity and feature evidence remain separately scoped below.
    evidence_id: starcore-board-source-review-2026-08-25
    evidence_ref: docs/verification/2026-08-26-starcore-evidence-normalization.md
    method: source-review
  code_compiled:
    status: verified
    checked_at: "2026-08-26"
    evidence: The desktop earthquake warning station compiled with the isolated ChatMaker-managed Arduino CLI, mindplus:esp32@0.0.1 core, and six hash-locked mPython libraries; earlier Mind+ 1.8 and 2 evidence remains valid.
    evidence_id: starcore-quake-chatmaker-managed-compile-2026-08-26
    evidence_ref: docs/verification/2026-08-26-starcore-independent-cli.md
    method: command-result
  firmware_uploaded:
    status: verified
    checked_at: "2026-08-26"
    evidence: The same earthquake warning station was uploaded from the ChatMaker-managed environment through COM4, the only eligible wired port; all four Flash segments passed hash verification and RTS hard reset completed.
    evidence_id: starcore-quake-chatmaker-managed-upload-2026-08-26
    evidence_ref: docs/verification/2026-08-26-starcore-independent-cli.md
    method: command-result
  serial_evidence:
    status: verified
    checked_at: "2026-08-26"
    evidence: At 115200 baud the managed-toolchain build emitted STARCORE_QUAKE_STATION_UI_V2_READY, calibration completion, and continuing QUAKE_DATA acceleration values.
    evidence_id: starcore-quake-chatmaker-managed-serial-2026-08-26
    evidence_ref: docs/verification/2026-08-26-starcore-independent-cli.md
    method: serial-observation
  physical_effect_verified:
    status: not_applicable
    checked_at: "2026-08-25"
    evidence: A multi-function board has no honest all-board physical-effect aggregate; use feature_verification and the exact recipe or component record instead.
    evidence_id: starcore-board-aggregate-boundary-2026-08-25
    evidence_ref: docs/verification/2026-08-26-starcore-evidence-normalization.md
    method: not-applicable
feature_verification:
