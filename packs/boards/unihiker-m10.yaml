verification:
  source_reviewed:
    status: verified
    checked_at: "2026-08-26"
    evidence: Official M10 product, dimension, SVG/STEP and workflow pages confirm the Linux/Python route and mechanical envelope; the K10 page confirms a separate MCU route, while physical fit remains unverified.
  code_compiled:
    status: unverified
    checked_at: null
    evidence: null
  firmware_uploaded:
    status: not_applicable
    checked_at: "2026-08-21"
    evidence: M10 projects are synchronized to and run on Debian rather than flashed as MCU firmware.
  physical_effect_verified:
    status: unverified
    checked_at: null
    evidence: null
pins:
  - id: USB-C-5V
    kind: power-rail
    capabilities: [power-input, data]
  - id: USB-A
    kind: connector-signal
    capabilities: [usb-host, external-device]
  - id: GRAVITY-3P
    kind: connector-signal
    capabilities: [external-sensor, gpio]
  - id: GRAVITY-4P
    kind: connector-signal
    capabilities: [external-sensor, i2c]
  - id: EDGE
    kind: connector-signal
    capabilities: [gpio, i2c, spi, uart]
  - id: GND
    kind: ground
    capabilities: [ground, shared]
constraints:
  - Confirm the printed M10 identity; K10 is an MCU board and cannot run this Debian project workflow.
  - Power the board from a stable 5V/2A USB-C supply for projects with USB peripherals.
  - Treat external signal levels and connector pin assignments as unverified until the exact official pin page or physical labeling is checked.
  - Keep Python projects compatible with the active board interpreter; the Debian 10 system interpreter is Python 3.7 by default.
  - Do not claim screen, camera, audio, network, sensor or GPIO behavior until it is observed on the physical board.
toolchains:
  - id: unihiker-built-in-jupyter-python
