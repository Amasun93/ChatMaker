constraints:
- Use 3.3 V GPIO signals and a shared ground.
- D labels on the carrier and ESP32 GPIO numbers are different. Prefer the Dn symbols in Arduino sketches.
- Avoid a module that drives D2/GPIO3 during reset. Reserve GPIO19/20 for USB.
- Camera kit identity requires the attached Seeed Sense expansion. The USB descriptor can be shared with the ordinary board.
- Sense SD uses D8/D9/D10 and GPIO21 chip select. Do not drive the user LED independently while the SD card uses GPIO21.
- The Sense camera and PDM microphone have dedicated assignments. Disconnect power before changing the board-to-board connection.
