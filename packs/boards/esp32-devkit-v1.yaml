name: DOIT ESP32 DEVKIT V1 (ESP-WROOM-32)
family: esp32
mcu: ESP32
logic_voltage: 3.3
identity:
  profile_id: doit-esp32-devkit-v1-wroom32
  carrier_board: DOIT ESP32 DEVKIT V1
  module: ESP-WROOM-32
  physical_confirmation_required: true
  allowed_fqbn: [esp32:esp32:esp32doit-devkit-v1]
  forbidden_aliases: [ESP32 Dev Module, ESP32-DevKitC, FireBeetle, mPython, ESP32-C3, ESP32-S2, ESP32-S3]
sources:
  - title: Arduino-ESP32 3.3.11 DOIT board definition
    url: https://github.com/espressif/arduino-esp32/blob/3.3.11/boards.txt#L19873-L19901
  - title: Arduino-ESP32 3.3.11 DOIT variant pins
    url: https://github.com/espressif/arduino-esp32/blob/3.3.11/variants/doitESP32devkitV1/pins_arduino.h
