verification:
  source_reviewed:
    status: verified
    checked_at: "2026-08-15"
    evidence: Reviewed the official Arduino-ESP32 3.3.11 DOIT board/variant definitions and Espressif GPIO restrictions; module-only labels remain insufficient for carrier-board identity.
  code_compiled: &unverified
    status: unverified
    checked_at: null
    evidence: null
  firmware_uploaded: *unverified
  physical_effect_verified: *unverified
pins:
  - id: GPIO2
    capabilities: [digital, input, output, boot-sensitive]
  - id: GPIO23
    capabilities: [digital, input, output, spi-mosi]
  - id: GPIO34
    capabilities: [digital, analog-input, adc1, input-only, no-internal-pull]
  - id: 3V3
    capabilities: [power, 3.3v]
  - id: GND
    capabilities: [ground, shared]
constraints:
  - ESP-WROOM-32 is a module label, not carrier-board proof; confirm the DOIT PCB identity before compile or upload.
  - GPIO logic is 3.3 V; never connect a 5 V signal directly to an input.
  - For the beginner AP demo, drive the external LED from GPIO23 through a current-limiting resistor and return it to shared GND.
  - Power the 10 kOhm potentiometer from 3V3 and GND, then connect only its wiper output to GPIO34.
  - GPIO34-39 are input-only and do not have software pull-up or pull-down resistors.
  - GPIO0, GPIO2, GPIO5, GPIO12, and GPIO15 are sampled during boot; external pulls must preserve startup levels.
  - GPIO6-11 are reserved for flash and unavailable to ordinary projects.
  - Reserve GPIO1 and GPIO3 for download and serial logs by default.
  - Use GPIO34 on ADC1 for the AP demo because ADC2 cannot be used for analog reads while Wi-Fi is active.
toolchains:
  - id: arduino-cli-esp32
    status: exact_core_required_not_installed
    version: 3.3.11
    fqbn: esp32:esp32:esp32doit-devkit-v1
  - id: mindplus-esp32
    status: incompatible_target_profile
    evidence: Installed Mind+ exposes only FireBeetle, mPython, Tello, and FireBeetle Mesh variants.
  - id: platformio-esp32
    status: not_installed
