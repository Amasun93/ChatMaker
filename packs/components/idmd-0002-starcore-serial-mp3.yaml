schema_version: "1.0"
kind: component
id: idmd-0002-starcore-serial-mp3
hardware_id: IDMD-0002
name: 串口 MP3 播放模块
aliases: [星核串口MP3, 自研MP3播放模块, JQ8400-FL播放板]
category: output
interface: uart-9600-8n1
supply_voltage:
  minimum: 5.0
  maximum: 5.0
logic_boundary: Power from the board's explicit 5 V connector bank, cross TXD/RXD to P15/P16, share GND, and do not treat the 5 V rail as a GPIO.
source_ids: [starcore-module-catalog-snapshot, starcore-classroom-module-cards-snapshot, starcore-code-patterns-snapshot, starcore-board-pin-map-snapshot]
sources:
  - title: ChatMaker governed Starcore source manifest
    url: https://github.com/Amasun93/ChatMaker/tree/main/knowledge_sources
verification:
  source_reviewed:
    status: verified
    checked_at: "2026-08-17"
    evidence: The governed source audit confirms P15 as controller RX, P16 as controller TX, and the separate 5 V connector-bank power route.
  code_compiled:
    status: verified
    checked_at: "2026-08-18"
    evidence: starcore-idmd-0002-serial-mp3-compile-2026-08-18
  firmware_uploaded: &unverified
    status: unverified
    checked_at: null
    evidence: null
  physical_effect_verified: *unverified
historical_lead:
  status: legacy_reported
  evidence: Legacy Mind+ material remains a separate lead; storage medium, speaker, playback, and physical behavior remain unchecked.
pins:
  - id: VCC
    role: 5v-power
  - id: GND
    role: ground
  - id: TXD
    role: module-uart-transmit
  - id: RXD
    role: module-uart-receive
supported_boards: [idmc-0001-starcore-v4-2-2]
constraints:
  - Connect module TXD to controller P15 and module RXD to controller P16; the labels must cross.
  - P16 is startup-sensitive, so the module must not force an unsafe level during boot.
  - Send play commands on state changes rather than on every loop iteration.
identification:
  - Confirm IDMD-0002, JQ8400-FL, UART labels TXD/RXD, 5V/GND, speaker connection, and usable audio storage.
libraries:
  - name: Mind+ Serial MP3 extension
    headers: [DFRobot_SerialMp3.h]
    status: compile_verified
    notes: The checked-in example compiled with the installed Mind+ 1.8 library; runtime playback remains unverified.
mindplus:
  extension: serialMp3
  headers: [DFRobot_SerialMp3.h]
  api: serialMp3.begin(&Serial1, P15, P16); volume(); playList()
example_files:
  - examples/chatduino/starcore/starcore-idmd-0002-serial-mp3/starcore-idmd-0002-serial-mp3.ino
common_failures:
  - Connecting TXD to TX or RXD to RX prevents communication.
  - Missing media, an unsupported file layout, or no speaker can look like a UART failure.
board_notes:
  idmc-0001-starcore-v4-2-2: Use the explicit 5V/GND connector bank and the P15/P16 UART route confirmed by the governed board sources.
