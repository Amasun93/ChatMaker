supported_boards: [idmc-0001-starcore-v4-2-2, stardust-atmega328p]
constraints:
  - On Starcore use the MPython.h global display object; do not add U8g2 or a second SSD1306 driver.
  - On Stardust use DFRobot_SSD1306_I2C on A4/A5 with the observed 0x3C address; do not copy the Starcore display object API.
  - Chinese text uses Noto_Sans_CJK_SC_Light16.xbf at Flash address 0x400000; an application-only upload does not prove that the font asset is present.
  - Scan or confirm 0x3C versus 0x3D rather than guessing when the screen stays blank.
  - The source-reviewed card does not authorize drawPixel, clear, or clearDisplay APIs.
  - Prefer concise Chinese after the Mind+ Chinese font asset is verified; otherwise use a clearly documented ASCII fallback rather than claiming Chinese support.
  - Draw static screens once. For dynamic values, update only changed content or use a controlled refresh interval; do not clear and redraw the full screen in every loop.
identification:
  - Confirm IDMD-0021, 1.3-inch 128x64 OLED, SSD1306, and I2C pins before using this owned card.
libraries:
  - name: Mind+ MPython display API
    headers: [MPython.h]
    status: compile_verified
    notes: MPython.h supplied the global display object in both the Mind+ 1.8 and latest Mind+ 2 compilations; the user confirmed visible output for the exact welcome recipe on 2026-08-26.
  - name: DFRobot SSD1306 I2C for Stardust
    headers: [DFRobot_SSD1306_I2C.h]
    status: compile_verified
    notes: The exact Stardust status source compiled and uploaded, and the user later confirmed that the displayed content was normal.
mindplus:
  extension: esp32
  headers: [MPython.h]
  api: display.begin(0x3C); display.setCursorLine(); display.printLine(); display.fillInLine(); display.point()
example_files:
  - examples/chatduino/starcore/starcore-idmd-0021-oled-message/starcore-idmd-0021-oled-message.ino
common_failures:
  - Using an SH1106, SPI, or generic 0.96-inch module recipe can select the wrong driver, pinout, or dimensions.
  - A wrong address or mismatched-voltage I2C bank leaves the display blank or risks the ESP32 bus.
  - English working while Chinese is blank or garbled usually points to the separate Mind+ font asset at 0x400000, not to a need for U8g2.
board_notes:
  idmc-0001-starcore-v4-2-2: Use a matching-voltage I2C connector; P19 is SCL and P20 is SDA on the shared bus.
  stardust-atmega328p: The connected module responded at address 0x3C on A4(SDA)/A5(SCL); the exact Xingchen Board status page was confirmed visible after upload and again after a power cycle.
