schema_version: "1.0"
kind: component
id: ssd1306-i2c-128x64-module
name: Confirmed SSD1306 128x64 four-pin I2C OLED module
aliases: [0.96寸OLED, SSD1306显示屏, OLED屏幕]
category: display
interface: i2c
supply_voltage:
  minimum: 3.3
  maximum: 5.0
sources:
  - title: SSD1306 controller datasheet
    url: https://cdn-shop.adafruit.com/datasheets/SSD1306.pdf
  - title: Adafruit SSD1306 library
    url: https://github.com/adafruit/Adafruit_SSD1306
verification:
  source_reviewed:
    status: verified
    checked_at: "2026-08-17"
    evidence: Reviewed the controller datasheet and maintained Adafruit library compatibility notes.
  code_compiled:
    status: verified
    checked_at: "2026-08-17"
    evidence: Nano and Uno OLED dashboard examples compiled with Mind+ 2.x, and the ESP32 Adafruit SSD1306 example compiled on 2026-08-17. See docs/verification/2026-08-17-common-module-compilation.md.
  firmware_uploaded: &unverified
    status: unverified
    checked_at: null
    evidence: null
  physical_effect_verified: *unverified
pins:
  - id: VCC
    role: power
  - id: GND
    role: ground
  - id: SCL
    role: i2c-clock
  - id: SDA
    role: i2c-data
supported_boards:
  - arduino-nano-classic
  - arduino-uno-r3
  - esp32-devkit-v1
constraints:
  - Use this record only after confirming SSD1306, 128x64, four-pin I2C, and a module supply rating compatible with 5 V.
  - Do not substitute SH1106 or a seven-pin SPI display; scan for address 0x3C or 0x3D before changing libraries.
identification:
  - Confirm four pins labelled GND, VCC, SCL, and SDA, 128x64 resolution, SSD1306 controller, and the module supply rating.
libraries:
  - name: Mind+ DFRobot SSD1306 I2C library
    headers: [DFRobot_SSD1306_I2C.h]
    status: compile_verified
    notes: The checked-in Nano and Uno dashboard examples compiled with DFRobot_SSD1306_I2C.h and address 0x3C using Mind+ 2.x.
  - name: Adafruit SSD1306 2.5.17 and Adafruit GFX
    headers: [Adafruit_GFX.h, Adafruit_SSD1306.h]
    status: compile_verified
    notes: ESP32 example compiled with Arduino-ESP32 3.3.11, Adafruit SSD1306 2.5.17 and its resolved GFX dependency.
  - name: U8g2 UTF-8 font route for AVR
    headers: [U8g2lib.h]
    status: unverified
    notes: Nano and Uno may use a page-buffer U8g2 constructor plus a verified glyph subset for Chinese; check library availability, target glyph coverage, Flash and RAM by compiling the exact program.
example_files:
  - examples/chatduino/nano/oled-light/oled-light.ino
  - examples/chatduino/nano/oled-dashboard/oled-dashboard.ino
  - examples/chatduino/uno/oled-dashboard/oled-dashboard.ino
  - examples/chatduino/esp32/oled-i2c-hello/oled-i2c-hello.ino
common_failures:
  - A screen sold only as 0.96-inch OLED may use SH1106, SPI, another resolution, or another address.
  - Swapped SDA and SCL or the wrong 0x3C versus 0x3D address leaves the screen blank.
  - A U8g2 font that omits the requested glyphs cannot display them; a full CJK font may exceed Nano or Uno memory, so prefer a project-specific subset.
board_notes:
  arduino-nano-classic: Use SDA A4 and SCL A5; confirm module 5 V compatibility before connecting VCC to 5V.
  arduino-uno-r3: Use SDA A4 and SCL A5; confirm module 5 V compatibility before connecting VCC to 5V.
  esp32-devkit-v1: Use SDA GPIO21 and SCL GPIO22; power from 3V3 unless the exact breakout documents another safe arrangement.
