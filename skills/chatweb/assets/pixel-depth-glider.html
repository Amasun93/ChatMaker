<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>盐湖气象巡航</title>
  <style>
    :root {
      --page: #131e20; --panel: #1b292a; --line: #374849;
      --ink: #f1ebd8; --muted: #bdc9bd; --amber: #ffcb87; --green: #b7dfb4;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(ellipse at 20% -35%, #344a48 0, var(--page) 60%); }
    button { font: inherit; cursor: pointer; color: inherit; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid #fff1af; outline-offset: -4px; }
    button:disabled { cursor: default; opacity: .55; }
    .shell { width: min(1384px, 100%); margin: auto; padding: clamp(18px, 4vw, 58px); }
    .masthead { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    h1 { margin: 0; font-size: clamp(30px, 5.2vw, 70px); line-height: 1.07; letter-spacing: -.06em; }
    .masthead p { margin: 13px 0 0; color: var(--muted); font-size: clamp(13px, 1.4vw, 16px); }
    .pill { display: flex; align-items: center; gap: 8px; flex: none; border: 1px solid var(--line); padding: 8px 11px; font-size: 12px; color: var(--green); }
    .pill::before { content: ""; width: 6px; height: 6px; background: currentColor; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 254px; gap: 16px; align-items: start; }
    .mission { min-width: 0; border: 1px solid var(--line); background: var(--panel); }
    .scene { position: relative; isolation: isolate; overflow: hidden; aspect-ratio: 16 / 9; background: #c6a27d; }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .scene[data-phase="flying"] canvas { touch-action: none; }
    .meters { position: absolute; top: 12px; left: 12px; display: flex; gap: 4px; color: #fff0d4; pointer-events: none; }
    .meter { min-width: 70px; padding: 6px 8px; background: #142426e6; border-top: 2px solid #ded1a6; }
    .meter span { display: block; color: #ced7c8; font-size: 10px; }
    .meter strong { font: 700 17px ui-monospace, Consolas, monospace; }
    .meter small { font-size: 9px; }
    .feedback { position: absolute; inset: auto 12px 12px auto; max-width: calc(100% - 24px); margin: 0; padding: 7px 11px; background: #142426f2; color: #fff0d4; border-left: 3px solid #dcbd88; font-size: 12px; pointer-events: none; }
    .feedback[data-collected="true"] { border-color: #b7dfb4; color: #cbefc8; }
    .feedback:empty { display: none; }
    .overlay { position: absolute; inset: auto auto 14px 14px; max-width: calc(100% - 28px); padding: 13px; background: #162626f2; border-left: 3px solid var(--amber); }
    .overlay[hidden] { display: none; }
    .overlay h2 { font-size: clamp(17px, 2vw, 24px); margin: 0 0 4px; }
    .overlay p { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
    .primary { padding: 0 17px; min-height: 44px; border: 0; background: var(--amber); color: #282318; font-size: 14px; font-weight: bold; }
    .primary:hover { background: #ffdbaf; }
    .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; padding: 12px; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .touch-hint { display: none; }
    .buttons { display: flex; gap: 5px; flex-wrap: wrap; }
    .buttons button { min-height: 44px; min-width: 44px; border: 1px solid var(--line); background: #263735; padding: 0 10px; font-size: 12px; touch-action: none; }
    .buttons button:enabled:hover, .buttons button[aria-pressed="true"] { background: #375048; border-color: #799f8b; }
    .log { background: var(--panel); border: 1px solid var(--line); padding: 16px; }
    .log header { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .log h2 { margin: 0; font-size: 17px; }
    .log output { color: var(--amber); font: 700 15px ui-monospace, Consolas, monospace; }
    .log ol { padding: 0; margin: 12px 0 0; list-style: none; }
    .log li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 7px; align-items: center; min-height: 50px; border-top: 1px solid var(--line); font-size: 13px; }
    .log li::before { content: ""; border: 1px solid #93a89e; width: 7px; height: 7px; }
    .log li[data-status="next"]::before { background: var(--amber); border-color: var(--amber); }
    .log li[data-status="collected"]::before { background: var(--green); border-color: var(--green); }
    .log li[data-status="missed"]::before { border-color: #f6a389; }
    .reading { color: var(--muted); font-size: 11px; }
    .scale { color: var(--muted); margin: 10px 0 0; font-size: 11px; }
    @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 208px; } }
    @media (max-width: 760px) {
      .shell { padding: 19px 14px; }
      .masthead { align-items: start; gap: 10px; margin-bottom: 15px; }
      .masthead p { margin-top: 8px; }
      .pill { font-size: 10px; padding: 6px 7px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .scene { aspect-ratio: 4 / 3; }
      .log { padding: 12px; }
      .log ol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 11px; }
      .log li { min-height: 43px; }
      .controls { padding: 8px; }
      .overlay { inset: auto auto 8px 8px; max-width: calc(100% - 16px); padding: 9px; }
      .meters { top: 8px; left: 8px; }
      .meter { min-width: 56px; padding: 4px 6px; }
      .feedback { inset: auto 8px 8px auto; }
    }
    @media (pointer: coarse) {
      .touch-hint { display: inline; }
      .keyboard-hint { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <h1>盐湖气象巡航</h1>
        <p>驾驶滑翔机穿过盐湖上空的四座气象信标。</p>
      </div>
      <div class="pill" id="phase-label">待起飞</div>
    </header>
    <div class="layout">
      <section class="mission" aria-label="飞行与操控">
        <div id="flight" class="scene">
          <canvas id="view" tabindex="0" aria-label="盐湖飞行画面。方向键操控，Shift 加速，V 切换视角。">请用支持 Canvas 的浏览器打开。</canvas>
          <div class="meters">
            <div class="meter"><span>空速</span><strong id="speed">162</strong> <small>km/h</small></div>
            <div class="meter"><span>高度</span><strong id="altitude">17</strong> <small>m</small></div>
            <div class="meter"><span>下个信标</span><strong id="range">154</strong> <small id="range-unit">m</small></div>
          </div>
          <p id="feedback" class="feedback" role="status"></p>
          <div id="overlay" class="overlay">
            <h2 id="status-title">航线已就绪</h2>
            <p id="status-detail">对准琥珀色圆环，穿过时自动采集。</p>
            <button id="action" class="primary" type="button">开始巡航</button>
          </div>
        </div>
        <div class="controls">
          <p class="hint">
            <span class="keyboard-hint">方向键转向和升降 · Shift 加速 · V 切视角</span>
            <span class="touch-hint">在画面上拖动，左／右转向，上／下升降。</span>
          </p>
          <div class="buttons">
            <button type="button" id="boost" aria-pressed="false" disabled>加速</button>
            <button type="button" id="camera" aria-label="切换视角" disabled>尾追视角</button>
            <button type="button" id="pause" disabled>暂停</button>
            <button type="button" id="restart" disabled>重开</button>
          </div>
        </div>
      </section>
      <aside class="log" aria-label="气象记录">
        <header><h2>气象记录</h2><output id="log-count" aria-label="已采集信标">0 / 4</output></header>
        <ol id="station-log"></ol>
        <p class="scale">航线模拟 · 采集读数为演示数据</p>
      </aside>
    </div>
  </main>
  <script>
    "use strict";

    const byId = id => document.getElementById(id);
    const flight = byId("flight");
    const canvas = byId("view");
    const context = canvas.getContext("2d", { alpha: false });
    const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const stationList = [
      { name: "镜滩风速", x: 0, y: 17, z: 154, reading: "4.8 m/s" },
      { name: "浅池湿度", x: -12, y: 14, z: 396, reading: "43% RH" },
      { name: "盐丘温度", x: 12, y: 22, z: 653, reading: "26.4 °C" },
      { name: "回航气压", x: -2, y: 16, z: 903, reading: "1003 hPa" }
    ];
    const cruiseSpeed = 45;
    const courseEnd = 1010;
    const wingSpan = 12;
    const keys = new Set();
    const touch = { id: null, x: 0, y: 0, steer: 0, climb: 0 };
    const buttons = Object.fromEntries(["action", "boost", "camera", "pause", "restart"].map(id => [id, byId(id)]));
    const camera = { x: 0, y: 0, z: 0, yaw: 0, tilt: 0, zoom: 0 };
    const aircraft = { x: 0, y: 17, z: 0, roll: 0, pitch: 0, yaw: 0, speed: cruiseSpeed };
    const stationRows = stationList.map(station => {
      const row = document.createElement("li");
      const name = document.createElement("span");
      const reading = document.createElement("span");
      name.textContent = station.name;
      reading.className = "reading";
      row.append(name, reading);
      byId("station-log").append(row);
      return { row, reading };
    });

    let phase = "ready";
    let view = "chase";
    let stationIndex = 0;
    let readings = [];
    let boostPointer = null;
    let boostKey = false;
    let feedbackTime = 0;
    let boostLevel = 0;
    let lastTime = 0;
    let animation = null;
    let trailTime = 0;
    let trail = [];
    let width = 0;
    let height = 0;
    let horizon = 0;
    let centerX = 0;
    let centerY = 0;
    let focal = 0;
    let cameraCos = 1;
    let cameraSin = 0;
    let tiltCos = 1;
    let tiltSin = 0;

    const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
    const damp = (value, goal, rate, dt) => value + (goal - value) * (1 - Math.exp(-rate * dt));
    const mix = (a, b, t) => a + (b - a) * t;
    const fract = value => value - Math.floor(value);
    const noise = (x, z) => fract(Math.sin(x * 91.7 + z * 197.3) * 32591.41);

    // The model is an original stack of indexed horizontal silhouettes.
    function buildSlices() {
      const slices = [];
      for (let y = -1; y <= 3; y++) {
        const slice = [];
        for (let z = -13; z <= 13; z++) {
          for (let x = -wingSpan; x <= wingSpan; x++) {
            const span = Math.abs(x);
            const halfBody = z < -4 ? 1 : Math.min(2, Math.floor((13 - z) / 2));
            const fuselage = y < 1 && span <= halfBody - Number(y < 0 && halfBody > 1);
            const sweptWing = y === 0 && z <= 4 - span * 0.48 && z >= -2 - span * 0.21;
            const tail = y === 1 && span <= 3 && z >= -13 && z <= -10 - span * 0.6;
            const fin = y >= 1 && span === 0 && z >= -13 && z <= -6 - y * 1.5;
            const glass = y >= 1 && y < 3 && span <= 2 - y && z >= 1 && z <= 8 - y;
            if (!(fuselage || sweptWing || tail || fin || glass)) continue;
            let color = y < 0 ? "#9b8b70" : "#f4e5bc";
            if (sweptWing && span >= 8) color = span >= 11 ? "#f9a354" : "#c96843";
            if (sweptWing && span < 8 && z <= -2 - span * 0.21 + 1) color = "#bbaa8b";
            if (tail) color = "#d7c398";
            if (fin) color = y === 3 ? "#ffbc6b" : "#d5754b";
            if (glass) color = y === 2 ? "#83aca5" : "#3a5b63";
            if (y === 0 && span === 0 && z >= 8) color = "#fff6d4";
            slice.push({ x: x * 0.46, y: y * 0.46, z: z * 0.46, color });
          }
        }
        slices.push(slice);
      }
      return slices;
    }
    const gliderSlices = buildSlices();

    function orientation() {
      return {
        cr: Math.cos(aircraft.roll), sr: -Math.sin(aircraft.roll),
        cp: Math.cos(aircraft.pitch), sp: Math.sin(aircraft.pitch),
        cy: Math.cos(aircraft.yaw), sy: Math.sin(aircraft.yaw)
      };
    }

    function atAircraft(x, y, z, pose) {
      const bankX = x * pose.cr - y * pose.sr;
      const bankY = x * pose.sr + y * pose.cr;
      const lift = bankY * pose.cp + z * pose.sp;
      const forward = z * pose.cp - bankY * pose.sp;
      return {
        x: aircraft.x + bankX * pose.cy + forward * pose.sy,
        y: aircraft.y + lift,
        z: aircraft.z + forward * pose.cy - bankX * pose.sy
      };
    }

    function setCamera(dt = 0, snap = false) {
      const wide = view === "wide";
      const sway = prefersReducedMotion.matches ? 0 : aircraft.roll * 0.55;
      const goal = {
        x: aircraft.x - sway * 3 + (wide ? 11 : 0),
        y: aircraft.y + (wide ? 16 : 7.6),
        z: aircraft.z - (wide ? 36 : 22),
        yaw: (wide ? -0.21 : 0) + aircraft.yaw * 0.23,
        tilt: wide ? 0.24 : 0.12,
        zoom: 1 - boostLevel * 0.13
      };
      for (const key of Object.keys(goal)) {
        // Keep forward travel immediate. Damp camera framing and lateral motion.
        camera[key] = snap || key === "z" ? goal[key] : damp(camera[key], goal[key], 5, dt);
      }
    }

    function prepareProjection() {
      centerX = width / 2;
      centerY = height * 0.47;
      focal = Math.min(width * 0.78, height * 1.25) * camera.zoom;
      cameraCos = Math.cos(camera.yaw);
      cameraSin = Math.sin(camera.yaw);
      tiltCos = Math.cos(camera.tilt);
      tiltSin = Math.sin(camera.tilt);
      horizon = Math.round(centerY - tiltSin / tiltCos * focal);
    }

    function project(x, y, z) {
      const dx = x - camera.x;
      const dz = z - camera.z;
      const horizontal = dx * cameraCos - dz * cameraSin;
      const forward = dz * cameraCos + dx * cameraSin;
      const lift = y - camera.y;
      const depth = forward * tiltCos - lift * tiltSin;
      if (depth < 1) return null;
      const scale = focal / depth;
      return {
        x: centerX + horizontal * scale,
        y: centerY - (lift * tiltCos + forward * tiltSin) * scale,
        depth, scale
      };
    }

    function groundPoint(x, z) {
      return project(x, 0, z);
    }

    function polygon(points, color) {
      if (points.some(point => !point)) return;
      context.fillStyle = color;
      context.beginPath();
      for (const [index, point] of points.entries()) {
        const x = Math.round(point.x);
        const y = Math.round(point.y);
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.closePath();
      context.fill();
    }

    function ridge(base, amplitude, palette, shift) {
      const points = [{ x: 0, y: base + 18 }];
      for (let x = 0; x <= width + 4; x += 4) {
        const worldX = x + shift;
        const hills = 0.53 + 0.27 * Math.sin(worldX * 0.028) + 0.16 * Math.sin(worldX * 0.068 + 1);
        points.push({ x, y: base - Math.max(0, hills + noise(worldX, amplitude) * 0.10) * amplitude });
      }
      points.push({ x: width + 4, y: base + 18 });
      polygon(points, palette);
    }

    function drawLandscape() {
      const sky = context.createLinearGradient(0, 0, 0, Math.max(2, horizon + 12));
      sky.addColorStop(0, "#648785");
      sky.addColorStop(0.55, "#adac88");
      sky.addColorStop(1, "#edc68c");
      context.fillStyle = sky;
      context.fillRect(0, 0, width, height);
      const sunX = Math.round(width * 0.78 - camera.yaw * 55);
      const sunY = Math.round(horizon * 0.55);
      for (let y = -14; y <= 14; y++) {
        const half = Math.floor(Math.sqrt(196 - y * y));
        context.fillStyle = y < 6 ? "#ffe1a4" : "#f7ce88";
        context.fillRect(sunX - half, sunY + y, half * 2 + 1, 1);
      }
      for (let i = 0; i < 9; i++) {
        const x = ((width * noise(i, 5) - camera.x * 0.22 - camera.yaw * 42) % width + width) % width;
        const y = Math.floor(horizon * (0.36 + noise(i, 8) * 0.37));
        context.fillStyle = i % 2 ? "#dcca9f" : "#c7bfa0";
        context.fillRect(Math.round(x), y, 12 + Math.floor(noise(i, 1) * 32), 1);
      }
      ridge(horizon + 5, 27, "#9b9b80", camera.x * 0.37 + camera.yaw * 90);
      ridge(horizon + 8, 17, "#6f8379", camera.x * 0.65 + camera.yaw * 150 + 104);

      const salt = context.createLinearGradient(0, horizon, 0, height);
      salt.addColorStop(0, "#a7b2a0");
      salt.addColorStop(0.48, "#d7c39a");
      salt.addColorStop(1, "#cda36f");
      context.fillStyle = salt;
      context.fillRect(0, horizon + 5, width, height);
      const near = Math.floor((camera.z + 7) / 14) * 14 + 14;
      for (let z = near + 420; z >= near; z -= 14) {
        const bank = 30 + Math.sin(z * 0.012) * 12 + Math.sin(z * 0.034) * 4;
        const nextBank = 30 + Math.sin((z + 14) * 0.012) * 12 + Math.sin((z + 14) * 0.034) * 4;
        polygon([groundPoint(bank - 6, z), groundPoint(215, z), groundPoint(215, z + 14), groundPoint(nextBank - 6, z + 14)], "#b1c5a8");
        polygon([groundPoint(bank, z), groundPoint(215, z), groundPoint(215, z + 14), groundPoint(nextBank, z + 14)],
          z % 42 === 0 ? "#6c9d98" : "#76aba1");
        for (let col = -6; col <= 6; col++) {
          const t = noise(col, z);
          const x = col * 12 + (t - 0.5) * 11;
          const point = groundPoint(x, z);
          if (!point || point.y < horizon + 6 || point.y > height + 2 || point.x < -18 || point.x > width + 8) continue;
          context.fillStyle = x > bank ? (t > 0.52 ? "#98c3ac" : "#619b94") : (t > 0.49 ? "#eee0b4" : "#bba779");
          context.fillRect(Math.round(point.x), Math.round(point.y), Math.round(clamp(point.scale * (1 + t * 4), 1, 20)), point.scale > 4 ? 2 : 1);
        }
      }
    }

    function drawStation(station, active) {
      const center = project(station.x, station.y, station.z);
      if (!center || center.depth < 4 || center.depth > 430 || center.x < -80 || center.x > width + 80) return;
      const rx = clamp(center.scale * 7.4, 3, width * 0.47);
      const ry = rx * 0.74;
      const x = Math.round(center.x);
      const y = Math.round(center.y);
      const post = groundPoint(station.x, station.z);
      if (active && post) {
        context.fillStyle = "#8d84516b";
        context.fillRect(x, y + ry, 1, Math.max(0, post.y - y - ry));
        context.fillRect(x - 4, post.y, 9, 2);
      }
      context.fillStyle = active ? "#fff3ad" : "#d8d7b4";
      const size = active ? 2 : 1;
      for (let step = 0; step < 44; step++) {
        if (step % 11 > 7) continue;
        const angle = step * Math.PI / 22;
        const px = Math.round(x + Math.cos(angle) * rx);
        const py = Math.round(y + Math.sin(angle) * ry);
        context.fillRect(px, py, size, size);
      }
      if (!active || center.depth < 12) return;
      context.fillStyle = "#fff3ad";
      context.fillRect(x - 5, y, 3, 1);
      context.fillRect(x + 3, y, 3, 1);
      context.fillRect(x, y - 5, 1, 3);
      context.fillRect(x, y + 3, 1, 3);
      const tagX = clamp(x - 14, 4, width - 32);
      const tagY = clamp(y - ry - 14, 25, height - 14);
      context.fillStyle = "#334340";
      context.fillRect(tagX, tagY, 27, 10);
      context.fillStyle = "#fff3ad";
      context.font = "7px monospace";
      context.fillText("0" + (stationIndex + 1) + "/04", tagX + 3, tagY + 7);
    }

    function recordTrail(dt) {
      if (prefersReducedMotion.matches) {
        trail.length = 0;
        return;
      }
      trailTime += dt;
      for (const point of trail) point.life -= dt;
      while (trail.length && trail[0].life <= 0) trail.shift();
      if (trailTime < 0.032) return;
      const pose = orientation();
      const left = atAircraft(-5.4, 0, -1.7, pose);
      const right = atAircraft(5.4, 0, -1.7, pose);
      trail.push({ left, right, life: 0.25 + boostLevel * 0.17 });
      if (trail.length > 18) trail.shift();
      trailTime = 0;
    }

    function drawTrail() {
      context.strokeStyle = "#fff0bd";
      context.lineWidth = 1 + boostLevel * 0.7;
      for (const side of ["left", "right"]) {
        for (let index = 1; index < trail.length; index++) {
          const a = trail[index - 1][side];
          const b = trail[index][side];
          const p = project(a.x, a.y, a.z);
          const q = project(b.x, b.y, b.z);
          if (!p || !q) continue;
          context.globalAlpha = clamp(trail[index].life * 1.45, 0, 0.52);
          context.beginPath();
          context.moveTo(Math.round(p.x), Math.round(p.y));
          context.lineTo(Math.round(q.x), Math.round(q.y));
          context.stroke();
        }
      }
      context.globalAlpha = 1;
    }

    function drawGlider() {
      const shadow = groundPoint(aircraft.x + 9, aircraft.z + 6);
      if (shadow) {
        context.fillStyle = "#594f3b35";
        context.beginPath();
        context.ellipse(shadow.x, shadow.y, shadow.scale * 4.3, shadow.scale * 1.15, aircraft.roll * 0.2, 0, Math.PI * 2);
        context.fill();
      }
      const dots = [];
      const pose = orientation();
      for (const slice of gliderSlices) {
        for (const cell of slice) {
          const point = atAircraft(cell.x, cell.y, cell.z, pose);
          const pixel = project(point.x, point.y, point.z);
          if (pixel) dots.push({ ...pixel, color: cell.color });
        }
      }
      dots.sort((a, b) => b.depth - a.depth);
      for (const dot of dots) {
        const size = Math.max(1, Math.ceil(dot.scale * 0.57));
        context.fillStyle = dot.color;
        context.fillRect(Math.round(dot.x - size / 2), Math.round(dot.y - size / 2), size, size);
      }
    }

    function render() {
      if (!width || !height) return;
      prepareProjection();
      drawLandscape();
      for (let index = stationList.length - 1; index >= stationIndex; index--) {
        drawStation(stationList[index], index === stationIndex);
      }
      drawTrail();
      drawGlider();
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      width = Math.min(480, Math.max(288, Math.round(bounds.width * 0.68)));
      height = Math.round(width * bounds.height / bounds.width);
      canvas.width = width;
      canvas.height = height;
      context.imageSmoothingEnabled = false;
      render();
    }

    function refreshReadout() {
      const hasNext = stationIndex < stationList.length;
      byId("speed").textContent = Math.round(aircraft.speed * 3.6);
      byId("altitude").textContent = Math.round(aircraft.y);
      byId("range").textContent = hasNext ? Math.max(0, Math.ceil(stationList[stationIndex].z - aircraft.z)) : "—";
      byId("range-unit").hidden = !hasNext;
      flight.dataset.bank = Math.round(aircraft.roll * 180 / Math.PI);
      flight.dataset.distance = aircraft.z.toFixed(2);
      flight.dataset.view = view;
      buttons.camera.textContent = view === "chase" ? "尾追视角" : "广角视角";
    }

    function refreshLog() {
      const total = readings.filter(Boolean).length;
      byId("log-count").textContent = total + " / " + stationList.length;
      stationRows.forEach(({ row, reading }, index) => {
        const status = index < stationIndex ? (readings[index] ? "collected" : "missed") : (index === stationIndex ? "next" : "waiting");
        row.dataset.status = status;
        reading.textContent = { collected: stationList[index].reading, missed: "已错过", next: "下一站", waiting: "待采集" }[status];
      });
    }

    function setFeedback(message, collected = false) {
      const feedback = byId("feedback");
      feedback.textContent = message;
      feedback.dataset.collected = String(collected);
    }

    function clearInput() {
      keys.clear();
      Object.assign(touch, { id: null, steer: 0, climb: 0 });
      boostPointer = null;
      boostKey = false;
      buttons.boost.setAttribute("aria-pressed", "false");
    }

    function setPhase(next) {
      phase = next;
      flight.dataset.phase = phase;
      byId("phase-label").textContent = { ready: "待起飞", flying: "巡航中", paused: "已暂停", finished: "已返航" }[phase];
      byId("overlay").hidden = phase === "flying";
      buttons.boost.disabled = phase !== "flying";
      buttons.camera.disabled = phase === "ready" || phase === "finished";
      buttons.pause.disabled = phase !== "flying";
      buttons.restart.disabled = phase === "ready";
      if (phase === "flying") return;
      clearInput();
      lastTime = 0;
      if (phase === "paused") {
        byId("status-title").textContent = "已暂停";
        byId("status-detail").textContent = "当前航线与采集记录已保留。";
        buttons.action.textContent = "继续巡航";
      } else if (phase === "finished") {
        const collected = readings.filter(Boolean).length;
        byId("status-title").textContent = collected === stationList.length ? "气象采集完成" : "巡航结束";
        byId("status-detail").textContent = "已采集 " + collected + " / " + stationList.length + " 座信标。";
        buttons.action.textContent = "再飞一次";
        setFeedback("");
      }
      if (phase !== "ready" && !document.hidden) buttons.action.focus({ preventScroll: true });
    }

    function checkStations() {
      const station = stationList[stationIndex];
      if (!station || aircraft.z < station.z) return;
      const offsetX = (aircraft.x - station.x) / 7.4;
      const offsetY = (aircraft.y - station.y) / 5.5;
      const collected = offsetX * offsetX + offsetY * offsetY <= 1;
      readings[stationIndex] = collected;
      stationIndex++;
      feedbackTime = 3;
      setFeedback(collected ? "已采集 " + station.name + " · " + station.reading : "已错过 " + station.name, collected);
      refreshLog();
    }

    function step(dt) {
      const keyAxis = (minus, plus) => Number(keys.has(plus)) - Number(keys.has(minus));
      const steer = touch.id === null ? keyAxis("ArrowLeft", "ArrowRight") : touch.steer;
      const climb = touch.id === null ? keyAxis("ArrowDown", "ArrowUp") : touch.climb;
      boostLevel = damp(boostLevel, Number(keys.has("Shift") || boostPointer !== null || boostKey), 8, dt);
      aircraft.speed = mix(cruiseSpeed, 68, boostLevel);
      aircraft.roll = damp(aircraft.roll, steer * 0.70, 6, dt);
      aircraft.pitch = damp(aircraft.pitch, climb * 0.24, 6, dt);
      aircraft.yaw = damp(aircraft.yaw, steer * 0.24, 5, dt);
      aircraft.x = clamp(aircraft.x + steer * 13 * dt, -36, 36);
      aircraft.y = clamp(aircraft.y + climb * 8 * dt, 5, 34);
      aircraft.z += aircraft.speed * dt;
      setCamera(dt);
      recordTrail(dt);
      checkStations();
      if (feedbackTime > 0) {
        feedbackTime -= dt;
        if (feedbackTime <= 0) setFeedback("");
      }
      if (aircraft.z >= courseEnd) setPhase("finished");
    }

    function frame(now) {
      animation = null;
      if (phase !== "flying") return;
      const dt = lastTime ? clamp((now - lastTime) / 1000, 0, 0.08) : 0;
      lastTime = now;
      step(dt);
      refreshReadout();
      render();
      scheduleFrame();
    }

    function scheduleFrame() {
      if (phase === "flying" && animation === null) animation = requestAnimationFrame(frame);
    }

    function startFresh() {
      clearInput();
      view = "chase";
      stationIndex = 0;
      readings = [];
      feedbackTime = boostLevel = trailTime = lastTime = 0;
      trail = [];
      Object.assign(aircraft, { x: 0, y: 17, z: 0, roll: 0, pitch: 0, yaw: 0, speed: cruiseSpeed });
      setCamera(0, true);
      setFeedback("");
      refreshLog();
      refreshReadout();
      setPhase("flying");
      canvas.focus({ preventScroll: true });
      render();
      scheduleFrame();
    }

    function resume() {
      lastTime = 0;
      setPhase("flying");
      canvas.focus({ preventScroll: true });
      scheduleFrame();
    }

    function switchView() {
      if (phase !== "flying" && phase !== "paused") return;
      view = view === "chase" ? "wide" : "chase";
      if (phase === "paused" || prefersReducedMotion.matches) setCamera(0, true);
      refreshReadout();
      render();
    }

    buttons.action.addEventListener("click", () => phase === "paused" ? resume() : startFresh());
    buttons.restart.addEventListener("click", startFresh);
    buttons.pause.addEventListener("click", () => setPhase("paused"));
    buttons.camera.addEventListener("click", switchView);
    for (const button of [buttons.boost, buttons.camera]) {
      button.addEventListener("click", () => { if (phase === "flying") canvas.focus({ preventScroll: true }); });
    }

    window.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key.toLowerCase() === "v" && !event.repeat) switchView();
      if (event.key === "Escape" && !event.repeat) {
        if (phase === "flying") setPhase("paused");
        else if (phase === "paused") resume();
      }
      if (phase === "flying" && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Shift"].includes(event.key)) {
        event.preventDefault();
        keys.add(event.key);
      }
    });
    window.addEventListener("keyup", event => keys.delete(event.key));
    window.addEventListener("blur", clearInput);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && phase === "flying") setPhase("paused");
    });

    // The canvas owns the active drag. Suppress its compatibility tap so the next
    // deliberate touch on a separate control can be handled as a normal click.
    canvas.addEventListener("touchstart", event => {
      if (phase === "flying") event.preventDefault();
    }, { passive: false });
    canvas.addEventListener("pointerdown", event => {
      if (phase !== "flying" || touch.id !== null || event.button !== 0) return;
      event.preventDefault();
      Object.assign(touch, { id: event.pointerId, x: event.clientX, y: event.clientY, steer: 0, climb: 0 });
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", event => {
      if (touch.id !== event.pointerId) return;
      touch.steer = clamp((event.clientX - touch.x) / 44, -1, 1);
      touch.climb = clamp((touch.y - event.clientY) / 44, -1, 1);
    });
    for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
      canvas.addEventListener(type, event => {
        if (touch.id === event.pointerId) Object.assign(touch, { id: null, steer: 0, climb: 0 });
      });
      buttons.boost.addEventListener(type, event => {
        if (boostPointer !== event.pointerId) return;
        boostPointer = null;
        buttons.boost.setAttribute("aria-pressed", String(boostKey));
      });
    }
    buttons.boost.addEventListener("pointerdown", event => {
      if (phase !== "flying" || boostPointer !== null || event.button !== 0) return;
      boostPointer = event.pointerId;
      buttons.boost.setPointerCapture(event.pointerId);
      buttons.boost.setAttribute("aria-pressed", "true");
    });
    for (const type of ["keydown", "keyup"]) {
      buttons.boost.addEventListener(type, event => {
        if (event.key !== " " && event.key !== "Enter") return;
        event.preventDefault();
        boostKey = type === "keydown";
        buttons.boost.setAttribute("aria-pressed", String(boostKey || boostPointer !== null));
      });
    }
    buttons.boost.addEventListener("blur", () => {
      boostKey = false;
      buttons.boost.setAttribute("aria-pressed", String(boostPointer !== null));
    });

    setCamera(0, true);
    setPhase("ready");
    refreshLog();
    refreshReadout();
    new ResizeObserver(resize).observe(flight);
    resize();
  </script>
</body>
</html>
