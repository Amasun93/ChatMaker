name: macOS hardware compile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macos-hardware.yml'
      - 'distribution/core-runtime/requirements.lock'
      - 'examples/chatduino/**'
      - 'pyproject.toml'
      - 'runtime/**'
      - 'scripts/setup_local_runtime.sh'
      - 'scripts/workbuddy_preflight.py'
      - 'tests/hardware/**'
  pull_request:
    paths:
      - '.github/workflows/macos-hardware.yml'
      - 'distribution/core-runtime/requirements.lock'
      - 'examples/chatduino/**'
      - 'pyproject.toml'
      - 'runtime/**'
      - 'scripts/setup_local_runtime.sh'
      - 'scripts/workbuddy_preflight.py'
      - 'tests/hardware/**'

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        suite: [classroom, waveshare]
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CHATMAKER_PYTHON: python3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set project runtime directory
        run: printf 'CHATMAKER_RUNTIME_ROOT=%s\n' "$RUNNER_TEMP/ChatMaker Runtime" >> "$GITHUB_ENV"
      - name: Prepare project runtime and verify source
        run: |
          test "$(uname -m)" = '${{ matrix.architecture }}'
          bash scripts/setup_local_runtime.sh --check-only
          bash scripts/setup_local_runtime.sh
          python3 scripts/workbuddy_preflight.py --expected-revision "$GITHUB_SHA"
      - name: Verify portable Python setup without Python on PATH
        if: matrix.suite == 'classroom'
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/chatmaker-setup-tools.XXXXXX")
          for name in dirname uname mkdir rmdir mktemp mv rm; do
            ln -s "$(command -v "$name")" "$tools/$name"
          done
          portable_runtime="$RUNNER_TEMP/ChatMaker Portable Runtime"
          PATH="$tools" CHATMAKER_RUNTIME_ROOT="$portable_runtime" /bin/bash scripts/setup_local_runtime.sh > "$RUNNER_TEMP/chatmaker-portable-result.json"
          python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r["success"] and r["mode"] == "portable-python", r' "$RUNNER_TEMP/chatmaker-portable-result.json"
          CHATMAKER_RUNTIME_ROOT="$portable_runtime" "$portable_runtime/venv/bin/python3" scripts/workbuddy_preflight.py --expected-revision "$GITHUB_SHA"
      - name: Run hardware regression tests
        if: matrix.suite == 'classroom'
        run: |
          "$CHATMAKER_RUNTIME_ROOT/venv/bin/python3" -m unittest \
            tests.hardware.test_macos_arduino tests.hardware.test_managed_arduino \
            tests.hardware.test_managed_boundaries tests.hardware.test_workflow \
            tests.hardware.test_serial_monitor tests.hardware.test_waveshare_s3 -q
      - name: Cache the official K10 core archive
        if: matrix.suite == 'classroom'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ChatMaker Runtime/downloads/arduino/unihiker_k10-0.0.5.zip
          key: k10-archive-${{ hashFiles('runtime/chatmaker/installers/runtime_sources.json') }}
      - name: Prepare tools and compile the classroom examples
        env:
          CHATMAKER_COMPILE_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          cli="$CHATMAKER_RUNTIME_ROOT/bin/chatmaker-hardware"
          work="$RUNNER_TEMP/chatmaker-mac-results"
          mkdir -p "$work"
          python="$CHATMAKER_RUNTIME_ROOT/venv/bin/python3"

          prepare() {
            local key=$1
            shift
            if "$cli" --action prepare-environment --progress human "$@" > "$work/$key-prepare.json"; then
              return 0
            fi
            cat "$work/$key-prepare.json"
            if "$python" -c 'import json,sys; r=json.load(open(sys.argv[1])); e=str(r.get("detail","")); sys.exit(0 if "all_pinned_sources_failed:" in e and any(s in e for s in ("URLError:", "TimeoutError:", "download_interrupted", "download_too_slow", "download_http_status:503")) else 1)' "$work/$key-prepare.json"; then
              mv "$work/$key-prepare.json" "$work/$key-prepare-first-attempt.json"
              sleep 5
              "$cli" --action prepare-environment --progress human "$@" > "$work/$key-prepare.json" && return 0
              cat "$work/$key-prepare.json"
            fi
            return 1
          }
          compile() {
            local key=$1
            shift
            "$cli" --action compile --progress human "$@" > "$work/$key.json" || {
              cat "$work/$key.json"
              return 1
            }
            "$python" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["success"] and r["compile"]["artifacts"]; print(r["compile"]["fqbn"], [(a["size"],a["sha256"]) for a in r["compile"]["artifacts"]])' "$work/$key.json"
          }

          if [ "$CHATMAKER_COMPILE_SUITE" = waveshare ]; then
            for revision in v1 v2; do
              prepare "waveshare-$revision" --board-id waveshare-esp32-s3-touch-lcd-2-8 --revision "$revision"
              compile "screen-$revision" --board-id waveshare-esp32-s3-touch-lcd-2-8 --revision "$revision" --sketch examples/chatduino/waveshare-s3/screen-diagnostic
              compile "timer-$revision" --board-id waveshare-esp32-s3-touch-lcd-2-8 --revision "$revision" --sketch examples/chatduino/waveshare-s3/classroom-timer
            done
            compile tilt-dot --board-id waveshare-esp32-s3-touch-lcd-2-8 --revision v2 --sketch examples/chatduino/waveshare-s3/v2-tilt-dot
            exit 0
          fi

          prepare avr --board-id arduino-uno-r3
          compile uno --board-id arduino-uno-r3 --sketch examples/chatduino/uno/blink
          compile nano-new --board-id arduino-nano-classic --bootloader new --sketch examples/chatduino/nano/blink
          compile nano-old --board-id arduino-nano-classic --bootloader old --sketch examples/chatduino/nano/blink
          compile mega --board-id arduino-mega-2560 --sketch examples/chatduino/uno/blink
          prepare uno-r4 --board-id arduino-uno-r4-wifi
          compile uno-r4 --board-id arduino-uno-r4-wifi --sketch examples/chatduino/uno-r4-wifi/matrix-heart

          prepare classic --board-id nova-esp32 --library U8g2
          compile nova --board-id nova-esp32 --sketch examples/chatduino/nova-oled-hello
          compile doit --board-id esp32-devkit-v1 --sketch examples/chatduino/esp32/blink-external-led

          prepare s3 --board-id esp32-s3-devkitc-1-n8r8
          compile s3-devkit --board-id esp32-s3-devkitc-1-n8r8 --usb-mode native --sketch examples/chatduino/uno/blink
          compile xiao --board-id seeed-xiao-esp32s3 --sketch examples/chatduino/xiao-esp32s3/usb-blink
          compile xiao-sense --board-id seeed-xiao-esp32s3-sense --sketch examples/chatduino/xiao-esp32s3-sense/camera-check

          prepare k10 --board-id unihiker-k10
          compile k10 --board-id unihiker-k10 --sketch examples/chatduino/unihiker-k10/board-rgb

          prepare c3 --board-id esp32-c3-devkitm-1
          compile c3 --board-id esp32-c3-devkitm-1 --sketch examples/chatduino/uno/blink
          prepare c6 --board-id esp32-c6-devkitc-1
          compile c6 --board-id esp32-c6-devkitc-1 --usb-mode native --sketch examples/chatduino/uno/blink

          "$cli" --action prepare-environment --board-id nova-esp32 --library U8g2 --download-policy domestic-only > "$work/cache-reuse.json"
          "$python" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["success"] and not r["installation_performed"]' "$work/cache-reuse.json"
      - name: Upload compile evidence
        id: evidence
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: macos-${{ matrix.architecture }}-${{ matrix.suite }}-compile-results
          path: ${{ runner.temp }}/chatmaker-mac-results/*.json
          if-no-files-found: ignore
      - name: Retry evidence upload after a service error
        uses: actions/upload-artifact@v7
        if: always() && steps.evidence.outcome == 'failure'
        with:
          name: macos-${{ matrix.architecture }}-${{ matrix.suite }}-compile-results
          path: ${{ runner.temp }}/chatmaker-mac-results/*.json
          if-no-files-found: ignore
          overwrite: true
