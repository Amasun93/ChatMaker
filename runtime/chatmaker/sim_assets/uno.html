<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatSim · UNO R3 按钮亮灯</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #202d37;
    background: #f3f5f6;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .page { width: min(100% - 48px, 1120px); margin: 0 auto; }
  header { border-bottom: 1px solid #dbe2e5; background: #fff; }
  header .page { min-height: 61px; display: flex; align-items: center; }
  .brand { margin: 0; color: #075d59; font-size: 21px; font-weight: 800; letter-spacing: -.025em; }
  main { padding: 30px 0 24px; }
  h1 { margin: 0 0 7px; font-size: clamp(23px, 4vw, 34px); letter-spacing: -.035em; }
  .intro { margin: 0 0 22px; color: #4b5b65; font-size: 15px; line-height: 1.65; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  .preview, aside { min-width: 0; background: #fff; border: 1px solid #dbe2e5; border-radius: 14px; overflow: hidden; }
  .toolbar { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  button { font: inherit; }
  #run {
    display: inline-flex; align-items: center; gap: 9px; padding: 0 15px; min-height: 42px;
    background: #096962; border: 1px solid transparent; border-radius: 8px;
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #run::before { content: ""; width: 11px; height: 12px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  #run[data-running="true"] { background: #fff; border-color: #afc7c5; color: #115e58; }
  #run[data-running="true"]::before { clip-path: none; width: 10px; height: 10px; }
  #run:disabled { background: #637d7c; cursor: wait; }
  #run:focus-visible, #button:focus-visible { outline: 3px solid #007594; outline-offset: 2px; }
  .lamp-row {
    display: flex; align-items: center; gap: 7px; padding: 7px 9px; white-space: nowrap;
    border-radius: 7px; background: #eef2f4; color: #40515c; font-size: 13px;
  }
  .lamp { background: #86959d; border-radius: 50%; width: 8px; height: 8px; }
  .lamp-row[data-led="on"] { background: #fff1cd; color: #634500; }
  .lamp-row[data-led="on"] .lamp { background: #b77500; box-shadow: 0 0 6px 2px #ffd068; }
  .viewport {
    position: relative; width: 100%; aspect-ratio: 560 / 340;
    min-height: 225px; max-height: 386px; overflow: hidden;
    border-block: 1px solid #dee5e7;
    background: #f5f8f9 radial-gradient(#cdd8dc 1px, transparent 1.15px) center / 16px 16px;
  }
  .schematic {
    width: 560px; height: 340px; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(var(--scale, 0)); transform-origin: center;
  }
  #uno-part { display: block; position: absolute; top: 86px; left: 36px; }
  #button {
    position: absolute; left: 434px; top: 111px; width: 102px; height: 90px;
    display: grid; place-items: center; border: 1px solid transparent; border-radius: 12px;
    padding: 0; background: transparent; touch-action: none; user-select: none; cursor: pointer;
  }
  #button:not(:disabled):hover { border-color: #91aeae; background: #e7f1f1; }
  #button:disabled { cursor: default; }
  .switch-caption, .board-caption {
    position: absolute; margin: 0; color: #3b4d58; font-size: 14px;
    font-weight: 700; background: #f5f8f9; padding: 3px 6px; border-radius: 4px;
  }
  .switch-caption { left: 485px; top: 207px; transform: translateX(-50%); white-space: nowrap; }
  .board-caption { left: 53px; top: 300px; }
  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .status { margin: 0; padding: 13px 14px; min-height: 46px; color: #40515c; font-size: 14px; line-height: 1.4; }
  aside section { padding: 17px 16px; }
  aside section + section { border-top: 1px solid #e4e9eb; }
  h2 { margin: 0 0 11px; font-size: 16px; }
  ul { margin: 0; padding: 0; list-style: none; }
  .parts li { display: flex; justify-content: space-between; padding: 6px 0; gap: 8px; font-size: 14px; }
  .parts span { color: #4b5b65; white-space: nowrap; }
  .wire-list { display: grid; gap: 9px; }
  .wire-list li {
    display: grid; grid-template-columns: 19px minmax(0, 1fr); column-gap: 8px; align-items: start;
    padding: 8px 9px; background: #f1f5f6; border-radius: 7px; font-size: 13px; line-height: 1.5;
  }
  .wire-list li::before { content: ""; display: block; height: 4px; border-radius: 4px; background: var(--wire); margin-top: .55em; }
  .signal { --wire: #176eb3; }
  .ground { --wire: #353e47; }
  .hint { margin: 10px 0 0; color: #4b5b65; font-size: 13px; line-height: 1.55; }
  footer { margin: 15px 0 0; color: #53616a; font-size: 12px; overflow-wrap: anywhere; line-height: 1.6; }
  @media (max-width: 760px) {
    .page { width: min(100% - 24px, 610px); }
    main { padding-top: 20px; }
    .workspace { grid-template-columns: minmax(0, 1fr); gap: 13px; }
    .intro { margin-bottom: 15px; }
  }
</style>
</head>
<body>
<header><div class="page"><p class="brand">ChatSim</p></div></header>
<main class="page">
  <h1>UNO R3 按钮亮灯</h1>
  <p class="intro">试按外接按钮，观察 D13 板载灯。</p>
  <div class="workspace">
    <section class="preview" aria-label="电路仿真">
      <div class="toolbar">
        <button id="run" type="button" disabled>运行仿真</button>
        <div class="lamp-row" id="led" data-led="off" aria-label="D13 板载灯">
          <span class="lamp" aria-hidden="true"></span><span>D13 板载灯</span><strong id="led-state">熄灭</strong>
        </div>
      </div>
      <div class="viewport">
        <div class="schematic">
          <wokwi-arduino-uno id="uno-part" inert aria-hidden="true"></wokwi-arduino-uno>
          <button id="button" type="button" aria-label="按住外接按钮" aria-pressed="false" disabled>
            <wokwi-pushbutton id="button-part" color="red" inert aria-hidden="true"></wokwi-pushbutton>
          </button>
          <canvas class="wires" aria-hidden="true"></canvas>
          <p class="board-caption">Arduino UNO R3</p>
          <p class="switch-caption">外接按钮</p>
        </div>
      </div>
      <p class="status" id="status" role="status">正在加载元件…</p>
    </section>
    <aside aria-label="元件和接线">
      <section>
        <h2>需要的元件</h2>
        <ul class="parts">
          <li>Arduino UNO R3 <span>1 块</span></li>
          <li>四脚按键开关 <span>1 个</span></li>
          <li>杜邦线 <span>2 根</span></li>
        </ul>
      </section>
      <section>
        <h2>接线图已配好</h2>
        <ul class="wire-list">
          <li class="signal" data-board-pin="2" data-button-pin="1.l"><span><strong>D2</strong> → 图中按钮左上脚</span></li>
          <li class="ground" data-board-pin="GND.2" data-button-pin="2.l"><span><strong>GND</strong> → 图中按钮左下脚</span></li>
        </ul>
        <p class="hint">图中的 GND 在电源排针上，紧挨着 5V。接实物时，把按钮摆成和图中一样的方向。</p>
      </section>
    </aside>
  </div>
  <footer>运行固件 <code id="sketch">$sketch</code> · <code id="firmware-id" title="$sha256">$short_hash</code></footer>
</main>
<script>$engine</script>
<script>$parts</script>
<script id="firmware" type="application/octet-stream">$firmware</script>
<script>$simulator</script>
</body>
</html>
