<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatSim · UNO R3</title>
<style>
:root { color-scheme: light; font-family: system-ui, sans-serif; color: #112622; background: #f1f4ec; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 720px; margin: auto; padding: clamp(24px, 7vw, 70px) 24px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { margin: 0; font-weight: 750; letter-spacing: .05em; }
.board-label { margin: 0; font-size: .9rem; font-weight: 650; }
h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); margin: 2rem 0 .65rem; line-height: 1.14; }
p { line-height: 1.6; }
.intro { color: #43554c; margin: 0 0 1.4rem; }
.board { background: #17443e; color: #fff; border: 1px solid #32655f; border-radius: 24px; padding: clamp(20px, 6vw, 36px); }
.io { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { min-width: 0; padding: clamp(14px, 4vw, 24px); border-radius: 14px; background: #0c302c; }
.pin { color: #c2ded1; font: 650 .82rem system-ui, sans-serif; margin: 0 0 12px; }
.lamp { display: inline-block; width: 1.15rem; height: 1.15rem; border-radius: 50%; background: #7e9187; border: 2px solid #b3c5b8; margin-right: 8px; vertical-align: -.14rem; }
.tile[data-led="on"] .lamp { background: #ffd462; border-color: #fff2bd; box-shadow: 0 0 16px #ffca5e; }
.status { margin: .85rem 0 0; color: #c2ded1; font-size: .92rem; }
button { color: #102f28; background: #e7f4d4; border: 0; padding: 10px 13px; min-height: 44px; border-radius: 9px; font: inherit; font-weight: 700; cursor: pointer; touch-action: none; user-select: none; }
button[aria-pressed="true"] { background: #b4dc85; box-shadow: inset 0 2px 5px #143a2b40; }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible { outline: 3px solid #ffd462; outline-offset: 4px; }
footer { color: #43554c; margin-top: 1rem; font-size: .88rem; }
code { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header><p class="brand">ChatSim</p><p class="board-label">Arduino UNO R3 · 虚拟板</p></header>
  <h1>按按钮，看板载灯</h1>
  <p class="intro">按住虚拟按钮，观察 D13 的变化。也可以用 Tab 选中按钮，再按空格。</p>
  <section class="board" aria-label="虚拟电路">
    <div class="io">
      <div class="tile" id="led" data-led="off">
        <p class="pin">D13 · 板载灯</p>
        <span class="lamp" aria-hidden="true"></span><strong id="led-state">熄灭</strong>
      </div>
      <div class="tile">
        <p class="pin">D2 → 按钮 → GND</p>
        <button id="button" type="button" aria-pressed="false" disabled>按住按钮</button>
      </div>
    </div>
    <p class="status" id="status" role="status">正在启动固件</p>
  </section>
  <footer>固件来自 <code id="sketch">$sketch</code> · <code id="firmware-id" title="$sha256">$short_hash</code></footer>
</main>
<script>$engine</script>
<script id="firmware" type="application/octet-stream">$firmware</script>
<script>$simulator</script>
</body>
</html>
